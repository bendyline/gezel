buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
}
apply plugin: 'com.android.application'
android {
    namespace 'com.bendyline.gezel.runtimeconsumer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bendyline.gezel.runtimeconsumer'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
dependencies {
    implementation project(':bendyline-gezel-capacitor')
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
