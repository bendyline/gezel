buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
}
apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

group = 'com.bendyline.gezel'
version = providers.gradleProperty('gezelVersion').get()
repositories {
    google()
    mavenCentral()
    maven { url = uri(providers.gradleProperty('gezelMavenRepository').get()) }
}
android {
    namespace 'com.bendyline.gezel.runtime'
    compileSdk 36
    defaultConfig { minSdk 28 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    publishing { singleVariant('release') { withSourcesJar() } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    api "com.bendyline.gezel:gezel-llama:${version}"
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
    // ML Kit GenAI beta4 calls Job.cancel$default, which kotlinx-coroutines
    // first provides in 1.11. ML Kit speech's BOM pins 1.8.1, and that
    // resolution crashed the app the first time a Gemini Nano reply was
    // stopped (Galaxy S26+, 2026-09-26).
    implementation platform('org.jetbrains.kotlinx:kotlinx-coroutines-bom:1.11.0')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core'
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'gezel-runtime'
                pom {
                    name = 'Gezel native provider and model runtime'
                    licenses {
                        license { name = 'MIT'; url = 'https://opensource.org/license/mit' }
                    }
                }
            }
        }
        repositories { maven { url = uri(providers.gradleProperty('gezelMavenRepository').get()) } }
    }
}
