buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
}
apply plugin: 'com.android.application'

android {
    namespace 'com.bendyline.gezel.consumer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bendyline.gezel.consumer'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation "com.bendyline.gezel:gezel-llama:${providers.gradleProperty('gezelVersion').get()}"
}
