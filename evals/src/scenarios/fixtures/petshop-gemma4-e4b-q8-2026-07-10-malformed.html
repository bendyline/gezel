<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Shop</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #2a6e4d;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }
        header img {
            height: 50px; /* Placeholder size */
            margin-right: 15px;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2a6e4d;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }
        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .product-card button {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <img src="assets/logo.png" alt="Pet shop logo">
        <h1>Welcome to Paws & Claws Pet Shop</h1>
    </header>

    <div class="container">
        <h2>Our Featured Pets</h2>
        <div id="product-list" class="product-grid">
            <!-- Product cards will be rendered here by JavaScript -->
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Fluffy Cat", price: 49.99, image: "assets/cat.jpg" },
            { id: 2, name: "Wagging Dog", price: 79.50, image: "assets/dog.jpg" },
            { id: 3, name: "Tiny Hamster", price: 19.00, image: "assets/hamster.jpg" }
        ];

        const productList = document.getElementById('product-list');

        function renderProducts() {
            productList.innerHTML = ''; // Clear existing content
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = \`
                    <img src="\${product.image}" alt="\${product.name}">
                    <h3>\${product.name}</h3>
                    <p>Price: $\${product.price.toFixed(2)}</p>
                    <button data-id="\${product.id}">Add to Cart</button>
                \`;
                productList.appendChild(card);
            });

            // Attach event listeners after rendering
            document.querySelectorAll('.product-card button').forEach(button => {
                button.addEventListener('click', (e) => {
                    const productId = e.target.dataset.id;
                    handleAddToCart(productId);
                });
            });
        }

        function handleAddToCart(productId) {
            alert(\`Product ID \${productId} added to cart! (Functionality placeholder)\`);
            // In a real app, this would update state/UI
        }

        // Initialize the page content on load
        window.onload = renderProducts;
    </script>
</body>
</html>
