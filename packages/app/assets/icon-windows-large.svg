<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    Vector master for the 64/128/256 px Windows frames. The bench is drawn
    once and reflected around x=144, so the legs, holes, and grain cannot
    drift apart as the icon is revised.
  -->
  <defs>
    <linearGradient id="sage" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#94a489" />
      <stop offset="0.55" stop-color="#87997b" />
      <stop offset="1" stop-color="#7c8e70" />
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef9" />
      <stop offset="1" stop-color="#f3f1e8" />
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="8" y="8" width="240" height="240" rx="54" />
    </clipPath>
    <clipPath id="top-clip">
      <rect x="64" y="64" width="160" height="42" rx="5" />
    </clipPath>
    <clipPath id="brace-clip">
      <rect x="105" y="163" width="78" height="23" rx="4" />
    </clipPath>
    <clipPath id="left-leg-clip">
      <path d="M78 119h27l-8 95H65z" />
    </clipPath>
    <mask id="vise-jaw">
      <rect width="256" height="256" fill="#fff" />
      <circle cx="38.5" cy="85" r="10" fill="#000" />
    </mask>
    <path id="leg" d="M78 119h27l-8 95H65z" />
    <g id="leg-openings">
      <circle cx="91" cy="139" r="6.5" />
      <circle cx="80" cy="187" r="6.5" />
    </g>
    <g id="leg-grain" clip-path="url(#left-leg-clip)">
      <path d="M82 124c14 14 2 24 13 38s-4 27-19 42" />
      <path d="M91 123c10 16 1 24 8 38s-1 27-10 43" />
      <path d="M73 175c8-7 18-6 22 0s-7 12-17 8" />
    </g>
  </defs>

  <!-- Transparent corners let Windows place the mark cleanly on any shell surface. -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#sage)" />
  <rect
    x="9.5"
    y="9.5"
    width="237"
    height="237"
    rx="52.5"
    fill="none"
    stroke="#dce4d7"
    stroke-opacity=".28"
    stroke-width="3"
  />

  <!-- Broad quiet curves keep the field organic without raster noise. -->
  <g
    clip-path="url(#card-clip)"
    fill="none"
    stroke="#dce4d7"
    stroke-linecap="round"
    stroke-width="2"
    opacity=".08"
  >
    <path d="M-8 48c55-27 102 21 156-2s91-12 127 8" />
    <path d="M-12 224c63-35 112 15 170-11s86-8 116 10" />
    <path d="M18 18c12 50-10 86 3 127s5 73-9 102" />
    <path d="M235 1c-15 44 11 78-1 118s-2 83 15 116" />
  </g>

  <g fill="url(#ivory)" stroke="#e2e0d7" stroke-width="1">
    <!-- Vise with a separate jaw and generous spindle at Explorer sizes. -->
    <rect x="20" y="66" width="37" height="38" rx="5" mask="url(#vise-jaw)" />
    <rect x="36" y="39" width="5" height="92" rx="2.5" />
    <circle cx="38.5" cy="39" r="9" />
    <circle cx="38.5" cy="131" r="9" />

    <rect x="64" y="64" width="160" height="42" rx="5" />
    <use href="#leg" />
    <use href="#leg" transform="translate(288 0) scale(-1 1)" />
    <rect x="105" y="163" width="78" height="23" rx="4" />
  </g>

  <g fill="#849577">
    <use href="#leg-openings" />
    <use href="#leg-openings" transform="translate(288 0) scale(-1 1)" />
  </g>

  <g
    fill="none"
    stroke="#d4d1c6"
    stroke-linecap="round"
    stroke-width="2"
    opacity=".78"
  >
    <g clip-path="url(#top-clip)">
      <path d="M68 76c30-5 54 6 82 1s48-4 72 1" />
      <path d="M68 88c24 4 45-6 70-2s52 7 83-2" />
      <path d="M135 78c5-7 16-5 16 0s-12 8-17 3" />
      <path d="M71 97c37-7 69 5 103-1s32-2 48 1" />
    </g>
    <g clip-path="url(#brace-clip)">
      <path d="M108 173c20-5 42 5 71-2" />
      <path d="M136 179c6-6 16-3 15 1s-10 6-15 2" />
    </g>
    <use href="#leg-grain" />
    <use href="#leg-grain" transform="translate(288 0) scale(-1 1)" />
  </g>
</svg>
