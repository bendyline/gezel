<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gezel</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #667f62;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      .splash {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        height: 100%;
        width: 100%;
        background-color: #667f62;
        /* Stretch the mark's empty upper band across the window so the
           centered artwork sits in one continuous mottled-sage field. */
        background-image: url("./gezel-mark.png");
        background-repeat: no-repeat;
        background-position: center top;
        background-size: auto 500%;
      }

      .splash img {
        width: 50%;
        height: auto;
        max-height: 72%;
        object-fit: contain;
        opacity: 0;
        filter: saturate(0.72) contrast(0.92);
        animation: fade-in 360ms ease-out forwards;
      }

      .splash::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(102, 127, 98, 0.2);
        pointer-events: none;
      }

      @keyframes fade-in {
        to { opacity: 0.58; }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash img {
          animation-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img src="./gezel-mark.png" alt="Gezel" />
    </div>
  </body>
</html>
