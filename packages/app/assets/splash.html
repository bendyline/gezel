<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gezel</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #667f62;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      .splash {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        height: 100%;
        width: 100%;
        background-color: #667f62;
        /* Stretch the mark's empty upper band across the window so the
           centered artwork sits in one continuous mottled-sage field. */
        background-image: url("./gezel-mark.png");
        background-repeat: no-repeat;
        background-position: center top;
        background-size: auto 500%;
      }

      .splash img {
        width: 50%;
        height: auto;
        max-height: 72%;
        object-fit: contain;
        opacity: 0;
        filter: saturate(0.72) contrast(0.92);
        animation: fade-in 360ms ease-out forwards;
      }

      .splash::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(102, 127, 98, 0.2);
        pointer-events: none;
      }

      /* First launch does real work before the UI can load — unpacking the
         service bundle, provisioning the bundled runtimes — and on a cold
         machine that runs into minutes. The main process writes the current
         stage here (see setSplashStatus in main.ts) so the wait reads as
         progress rather than a hang. Stays empty, and therefore invisible,
         on the fast path. */
      .status {
        position: absolute;
        z-index: 2;
        bottom: 14%;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        max-width: 80%;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        letter-spacing: 0.06em;
        color: #f3ede0;
        opacity: 0;
        transition: opacity 240ms ease-out;
      }

      .status:not(:empty) {
        opacity: 0.82;
      }

      /* Animated ellipsis. On a pseudo-element rather than in the text so the
         main process can rewrite the stage with `textContent` without wiping
         it, and so splash.html needs no script of its own. Reserved width
         keeps the caption from shifting as the dots cycle. */
      .status:not(:empty)::after {
        content: "";
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: ellipsis 1.6s steps(1, end) infinite;
      }

      @keyframes ellipsis {
        0%   { content: ""; }
        25%  { content: "."; }
        50%  { content: ".."; }
        75%  { content: "..."; }
      }

      @media (prefers-reduced-motion: reduce) {
        .status {
          transition-duration: 0.01ms;
        }
        /* Hold a steady ellipsis rather than pulsing one. */
        .status:not(:empty)::after {
          animation: none;
          content: "...";
        }
      }

      @keyframes fade-in {
        to { opacity: 0.58; }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash img {
          animation-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <!-- The splash uses a transparent cutout so its illustration can share
           the exact same continuous texture field as the rest of the window. -->
      <img src="./gezel-mark-transparent.png" alt="Gezel" />
      <p class="status" id="gezel-splash-status" role="status" aria-live="polite"></p>
    </div>
  </body>
</html>
