<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Native 16 px artwork. Every edge lands on the output pixel grid. -->
  <rect width="16" height="16" fill="#849577" />

  <defs>
    <!-- The right leg is an actual reflection of this path, not a redraw. -->
    <path id="leg" d="M3 6h3L5 14H2z" />
  </defs>

  <g fill="#faf9f3" shape-rendering="crispEdges">
    <rect x="2" y="2" width="12" height="3" />
    <use href="#leg" />
    <use href="#leg" transform="translate(16 0) scale(-1 1)" />
    <rect x="5" y="9" width="6" height="2" />
  </g>
</svg>
