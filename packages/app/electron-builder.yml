appId: com.bendyline.gezel
productName: Gezel
copyright: Copyright © 2026 Bendyline LLC

# Override the default artifact-name template (which uses the package
# name verbatim). Our package.json name is `@bendyline/gezel-app` —
# the `@bendyline/` scope prefix gets interpreted as a directory by
# fpm/dpkg, so the .deb build dies with "Parent directory does not
# exist: dist/installers/@bendyline". Substituting ${productName}
# ("Gezel") sidesteps the problem and gives users an installer file
# named after the app, not the npm package.
#
# Fallback only — each platform below overrides this to name itself
# (`-mac-`, `-windows-`, `-linux-`). The platform word is written out
# literally rather than via `${platform}`, which expands to the BUILD
# HOST's process.platform (`darwin`/`win32`) — the wrong value to put in
# a filename, and wrong outright the moment anything cross-builds.
# `${arch}` is left alone: electron-builder already resolves it per
# target, which is what yields `amd64` for .deb and `x86_64` for .rpm.
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: dist/installers
  buildResources: assets

# A generated, hash-manifested legal bundle. Keeping this outside app.asar
# makes notices readable after installation and lets release CI extract each
# finished installer and verify the exact bytes under resources/licenses/.
extraResources:
  - from: dist/licenses
    to: licenses

# Portable local-model bundles. electron-builder writes the platform-specific
# registration (Windows ProgID, macOS document type, Linux MIME association),
# while main.ts handles first-instance, second-instance, and macOS open-file
# delivery through the same scan-before-confirm flow.
fileAssociations:
  - ext: gezmodel
    name: Gezel Model Bundle
    description: Portable Gezel local AI model
    role: Editor

# The shipped service bundle ships as a single gzipped tarball plus a small
# JSON sidecar (`{version, sha256, sizeBytes, fileCount}`) instead of as
# ~100k loose files. NSIS extracting one big file vs. 100k tiny ones is
# orders of magnitude faster (the difference between a ~30-minute Windows
# install and a few seconds, since Defender real-time-scans each extracted
# file synchronously). The Electron shell extracts the tarball into
# `~/.gezel/service/` on first launch via `extract-service-bundle.js`.
#
# The pnpm bundle (pinned binary for scheduled-job installs) and the node
# bundle (pinned Node.js runtime for the sandbox runner + Copilot login)
# stay loose — each is a small handful of files and they don't trigger
# the same Defender-per-file overhead.
#
# `native-bin/<platform>[-<variant>]/` holds the per-platform native engine
# binaries (llama.cpp, stable-diffusion.cpp, whisper.cpp, ds4, plus the uv
# runtime and the device-health / service-host helpers) produced by
# `.github/workflows/build-native.yml` and staged by
# `scripts/fetch-native-binaries.mjs`. The per-platform contents are the
# contract in `scripts/native-payload.mjs`. ~40 large files — same shape as
# above; loose is fine.
files:
  - dist/main.js
  - dist/preload.cjs
  - dist/extract-service-bundle.js
  - dist/migrate-legacy-shared.js
  - dist/service-bundle.tar.gz
  - dist/service-bundle.meta.json
  - dist/pnpm-bundle/**/*
  - dist/node-bundle/**/*
  - dist/duckdb-bundle/**/*
  - dist/ui/**/*
  # Vite source maps are useful in the build tree but not loaded by the
  # packaged renderer. The RC shipped 215 of them (70.8 MiB) as loose files.
  - '!dist/ui/**/*.map'
  # Keep Electron-process source maps available to local builds without
  # carrying them in every installer. In particular, main.js.map alone is
  # several MiB and the packaged main process never loads it.
  - '!dist/*.map'
  - native-bin/**/*
  - assets/icon.png
  - assets/icon.ico
  # macOS menu-bar (tray) template icon + its @2x HiDPI variant, read by
  # the main process via nativeImage.createFromPath (see src/tray.ts).
  # Windows uses the multi-resolution icon.ico above so the shell can select
  # native 16–48 px taskbar frames or vector-derived 64–256 px Explorer frames;
  # Linux derives its tray icon from icon.png.
  - assets/trayTemplate.png
  - assets/trayTemplate@2x.png
  # Five indeterminate activity frames. The main process cycles these only
  # while a chat turn is live; each base PNG picks up its @2x sibling.
  - assets/trayWorking*Template*.png
  - assets/splash.html
  # The splash uses the opaque mark as its full-window texture source and a
  # transparent cutout for the centered illustration. Without listing both
  # here electron-builder leaves them out of app.asar and the splash renders
  # a broken-image icon during the handoff to the real UI.
  - assets/gezel-mark.png
  - assets/gezel-mark-transparent.png
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/*.d.ts'
  - '!**/node_modules/.bin'
  # @napi-rs/canvas comes in as a transitive optionalDependency of
  # pdfjs-dist (via @bendyline/squisq-editor-react). pdfjs-dist
  # branches at runtime on `isNodeJS` and uses the DOM canvas in
  # browser-like contexts — which is what the Electron renderer is.
  # The Node-side canvas factory is dead code for us; nothing ever
  # calls `require("@napi-rs/canvas")`. Excluding it strips ~7 MB
  # per linux/win installer and silences the "dependency not found
  # on disk" warning for the platform-specific sibling tarballs that
  # pnpm only partially installs (optionalDependencies pattern).
  # `@napi-rs/keyring` is a real runtime dep (secrets/keyring-store.ts)
  # — the patterns below target `canvas` specifically.
  - '!**/node_modules/@napi-rs/canvas/**'
  - '!**/node_modules/@napi-rs/canvas-*/**'

# `dist/ui/` is asar-unpacked because Hono inside the spawned daemon (a
# plain Node child of the supervisor — no Electron fs patches) reads
# `index.html` and chunks via plain `fs.readFile`. Asar reads only work
# from the Electron main process; everything else needs a real file.
#
# The service-bundle tarball + meta sidecar are asar-unpacked because the
# install-time `extract-service-bundle.js` CLI reads them via plain
# `fs.readFile` (it runs as a child Node process, not inside Electron's
# patched fs). Same reason the loose tree was unpacked before.
#
# `extract-service-bundle.js` is also asar-unpacked because installers invoke
# it in a plain Node environment (the bundled node.exe on Windows, and
# ELECTRON_RUN_AS_NODE on macOS/Linux). Neither path has Electron's patched fs,
# so a path inside `app.asar` would fail to resolve. Keeping the CLI as a real
# file on disk sidesteps every "does asar work here?" question.
asarUnpack:
  # main.js, preload.cjs, and package.json are asar-unpacked to work
  # around an electron-builder 26.x packing bug that drops the first ~13
  # bytes from package.json during rewrite, shifting every subsequent
  # file's offset in the asar manifest. The asar's `dist/main.js` ends up
  # corrupted (starts with ` = Object.defineProperty;` instead of
  # `var __defProp = …`) and Electron crashes silently with exit code 1.
  # Unpacking these forces Electron's fs to read them from disk, bypassing
  # the corrupted asar window entirely. Delete the four entries below when
  # electron-builder fixes the underlying bug.
  - dist/main.js
  - dist/preload.cjs
  - package.json
  - dist/extract-service-bundle.js
  - dist/migrate-legacy-shared.js
  - dist/service-bundle.tar.gz
  - dist/service-bundle.meta.json
  - dist/pnpm-bundle/**/*
  - dist/node-bundle/**/*
  - dist/duckdb-bundle/**/*
  - dist/ui/**/*
  - native-bin/**/*

# afterPack chains two jobs (see scripts/after-pack.cjs):
#   1. The asar offset-bug workaround (scripts/fix-asar.cjs) — an
#      electron-builder 26.x packing bug shifts asar manifest offsets by
#      ~13 bytes; the hook restores the affected files from canonical
#      source. Delete that half once electron-builder ships a fix.
#   2. On Windows, an Authenticode sweep that signs every exe/dll in the
#      packed payload lacking a valid signature. electron-builder later
#      traverses executable files in app.asar.unpacked too, so sign.cjs
#      preserves the already-valid native signatures and their manifest-
#      pinned bytes while this sweep covers DLLs its pass does not reach.
afterPack: scripts/after-pack.cjs

# electron-builder's built-in @electron/notarize integration notarizes both
# the signed .app and the final .pkg when APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are present. A custom
# afterSign hook only sees the .app and would leave the installer package
# itself unnotarized.

# electron-builder needs a publish target to generate each platform's update
# metadata. The release workflow still runs with `--publish never` and uploads
# artifacts via softprops/action-gh-release. At runtime main.ts deliberately
# overrides this GitHub provider with a generic provider rooted at the newest
# exact `v<semver>` app release, because this repository's `native-v*` releases
# must never participate in Electron update discovery.
publish:
  provider: github
  owner: bendyline
  repo: gezel

# ── Windows ─────────────────────────────────────────────────────────────
# NSIS installer with Azure Trusted Signing (Authenticode). Local developer
# builds may be unsigned; the production release workflow rejects missing
# credentials before packaging and verifies the final signatures.
win:
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  # Also decides the install folder and the uninstaller filename, which is why
  # they are lowercase: electron-builder sets AppInfo.productFilename from
  # `executableName` when present (falling back to productName), and NSIS uses
  # that one value for the exe, `$INSTDIR` (C:\Program Files\gezel), and
  # "Uninstall gezel.exe". There is no separate install-directory option, so
  # "Gezel\ containing gezel.exe" is not expressible — set this to `Gezel` and
  # the binary becomes Gezel.exe too. Left lowercase deliberately; note that
  # NTFS preserves an existing folder's case, so flipping it would only affect
  # machines installing for the first time.
  executableName: gezel
  # Signing options moved under signtoolOptions in electron-builder 26.
  #
  # `publisherName` must match the CN on the Authenticode certificate exactly —
  # electron-updater compares it against the downloaded installer's signature
  # before running it, so a mismatch silently breaks auto-update.
  #
  # The publisher shown in Add/Remove Programs is a DIFFERENT value:
  # electron-builder derives it from `author.name` in packages/app/package.json
  # (AppInfo.companyName), not from this field. Both now read "Bendyline LLC";
  # keep them in step, and note that author.name also becomes the Vendor and
  # Maintainer on the Linux .deb/.rpm.
  signtoolOptions:
    publisherName: 'Bendyline LLC'
    sign: scripts/sign.cjs
    signingHashAlgorithms:
      - sha256
  # The first-party service host sits next to the Electron exe in
  # $INSTDIR (C:\Program Files\gezel\gezel-service-host.exe) so the NSIS
  # hooks can register it as GezelService's ImagePath. The install folder is
  # lowercase because electron-builder derives it from `executableName` below
  # (AppInfo.productFilename), not from productName — see `executableName`.
  # It is built by
  # the native pipeline (native/helpers/service-host/), arrives in
  # native-bin/ born-signed from the native release, and the afterPack
  # sweep leaves validly-signed files untouched — installer bytes stay
  # identical to the release asset. Replaces the vendored NSSM wrapper.
  extraFiles:
    - from: native-bin/win32-x64/gezel-service-host.exe
      to: gezel-service-host.exe

nsis:
  # Per-machine install (Program Files), elevates UAC at install time.
  # The installer's customInstall hook in installer/nsis-hooks.nsh uses the
  # elevation to register gezeld as the GezelService Windows Service —
  # hosted by the first-party gezel-service-host.exe above, under a
  # restricted LocalService identity — with system-scope state in
  # C:\ProgramData\Gezel\.
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: false
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  # Assisted-mode NSIS reserves a fixed 164x314 sidebar. Keep the paired
  # workshop scenes at that exact size so NSIS neither stretches them nor
  # falls back to electron-builder's stock blue software-box artwork.
  installerSidebar: assets/installerSidebar.bmp
  uninstallerSidebar: assets/uninstallerSidebar.bmp
  createDesktopShortcut: true
  createStartMenuShortcut: true
  license: EULA.txt
  # NSIS macros that install/uninstall GezelService via sc.exe, and clean
  # up the retired NSSM wrapper left behind by NSSM-era installs.
  include: installer/nsis-hooks.nsh
  # Enables electron-updater to pull delta packages on Windows — much
  # smaller downloads for users on slow connections.
  differentialPackage: true

# ── macOS ───────────────────────────────────────────────────────────────
# PKG installer on Apple Silicon only. Intel Mac (x64) was dropped from
# the release matrix — Apple's own support is wrapping up and on-device
# first-run routes Intel users to Copilot/OpenAI anyway. PKG is required
# so the postinstall script can register a LaunchDaemon (DMG
# drag-installs can't elevate). The Developer ID Installer certificate
# signs the PKG; the standard Developer ID Application cert signs the
# .app inside it. electron-builder's built-in notarization covers both the
# .app and final .pkg, gated on APPLE_ID/APP_SPECIFIC_PASSWORD/TEAM_ID.
mac:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # The native engines deliberately target the Accelerate ILP64 API introduced
  # in macOS 13.3, while the pinned official Node 24 runtime declares 13.5.
  # The product floor must be the highest requirement in the complete payload.
  minimumSystemVersion: '13.5'
  target:
    - target: pkg
      arch:
        - arm64
    # DO NOT REMOVE, even though nothing ever downloads this ZIP.
    #
    # It looks like dead weight — ~447 MB per release for a file no user
    # fetches. Squirrel.Mac never sees it: src/updater/mac-pkg.ts sets
    # `autoDownload = false` on darwin and downloads the signed PKG itself
    # (MacUpdater excludes pkg/dmg and cannot elevate for the LaunchDaemon).
    # So MacUpdater.doDownloadUpdate — the only code that resolves this file —
    # is unreachable, and `quitAndInstall` is guarded off on darwin too.
    #
    # But the ZIP *target* is the only macOS target that emits
    # `latest-mac.yml`. `PkgTarget` writes no update info at all, and
    # `ArchiveTarget` gates its update-info generation on
    # `isWriteUpdateInfo && format === "zip"` (app-builder-lib
    # macPackager.ts constructs the mac zip target with that flag set).
    # Delete this target and the feed disappears, so
    # `GenericProvider.getLatestVersion()` 404s on latest-mac.yml and throws
    # ERR_UPDATER_CHANNEL_FILE_NOT_FOUND — macOS stops discovering updates
    # entirely, silently, because the PKG download path never gets that far.
    #
    # Verified against electron-updater 6.8.9 / app-builder-lib 26.15.3 and
    # pinned by scripts/mac-update-contract.test.mjs.
    - target: zip
      arch:
        - arm64
  icon: assets/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # Drop electron-builder's stock privacy usage strings. It injects five of
  # them into every macOS app, and shipping them was making Gezel claim reach
  # it does not have: a July 2026 audit of v1.26211.23 found the installed
  # Info.plist telling users "This app needs access to the camera" and
  # "…to Bluetooth" for hardware nothing in the product touches.
  #
  # Voice input is the sole live-media exception: the chat composer's explicit
  # Narrate action records microphone-only audio and sends short takes to the
  # user's configured speech-to-text engine. Camera, screen capture, Bluetooth,
  # WebUSB, and Web Serial still have no product surface and remain absent.
  #
  # `null` is the documented removal: extendInfo is deep-assigned over the
  # generated plist, then app-builder-lib deletes every null/undefined key
  # (macPackager.js — "for (const [k, v] of Object.entries(appPlist))").
  #
  # SHARP EDGE: macOS *terminates* an app that touches protected capture APIs
  # with no matching usage string. Keep this copy aligned with the feature.
  # scripts/macos-privacy-strings.test.mjs fails the build if a capture API
  # appears without one, so this cannot rot silently.
  extendInfo:
    NSMicrophoneUsageDescription: Gezel records your voice when you choose Narrate so your configured speech-to-text engine can add it to the chat prompt.
    NSCameraUsageDescription: null
    NSAudioCaptureUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
  # Native release Mach-O files are already Developer ID signed with hardened
  # runtime before their hashes enter NATIVE_FILE_MANIFESTS.json. Re-signing
  # them while wrapping the Electron app would change their bytes and defeat
  # source-pinned reuse by standalone clients. Keep those inner signatures
  # untouched; codesign still seals the complete native-bin tree (including
  # symlink metadata) into the outer app signature, and release CI verifies
  # both the per-file manifest and the final app with --strict --deep.
  #
  # The pinned official Node runtime follows the same provenance rule. It
  # arrives Developer ID signed, hardened, and notarized by the Node.js
  # Foundation, then fetch-node.mjs records the exact executable bytes in
  # sha256.txt. Re-signing it here replaces that vendor signature and makes
  # the supervisor reject the packaged runtime as modified.
  signIgnore:
    - /Contents/Resources/app\.asar\.unpacked/native-bin/
    - /Contents/Resources/app\.asar\.unpacked/dist/node-bundle/node$
    # DuckDB follows the same vendored-provenance rule: the DuckDB Foundation
    # ships it Developer ID signed, hardened, and notarized under their own
    # team, and re-signing it here would replace that attestation with ours.
    - /Contents/Resources/app\.asar\.unpacked/dist/duckdb-bundle/duckdb$
  # Ship the LaunchDaemon plist + uninstall.sh inside the .app bundle
  # so the postinstall script can find them at known paths under
  # /Applications/Gezel.app/Contents/Resources/.
  extraResources:
    - from: installer/com.bendyline.gezeld.plist
      to: com.bendyline.gezeld.plist
    - from: installer/uninstall.sh
      to: uninstall.sh

pkg:
  # Standard PKG settings for an admin-level system install.
  installLocation: /Applications
  allowAnywhere: false
  allowCurrentUserHome: false
  # The LaunchDaemon and postinstall contract both use the canonical
  # /Applications/Gezel.app path. Leaving electron-builder's default (`true`)
  # lets PackageKit discover another copy of Gezel.app — including the packed
  # build tree in CI — and install over that copy instead of /Applications.
  isRelocatable: false
  # The postinstall script registers the LaunchDaemon. electron-builder
  # finds `preinstall`, `postinstall` files in this directory and wraps
  # them into the PKG payload.
  #
  # IMPORTANT: this path is resolved by electron-builder via
  # `path.resolve(directories.buildResources, pkg.scripts)` — i.e.
  # relative to `assets/`, not the package root. Without the `../` the
  # scripts dir is looked up at `assets/installer/macos-pkg-scripts/`
  # (which doesn't exist), electron-builder silently produces a PKG with
  # no Scripts payload, the LaunchDaemon never gets installed, and the
  # Electron supervisor falls through to spawning gezeld as the logged-in
  # user — defeating the system-service design.
  scripts: ../installer/macos-pkg-scripts
  # EULA shown as the "License" step in macOS Installer.app before
  # install proceeds — user must Agree. Same file as the Windows NSIS
  # license step (see `nsis.license` above). Path is resolved relative
  # to `directories.buildResources` (= `assets/`), so the `../` walks
  # up to packages/app/EULA.txt — same pattern as `pkg.scripts` above.
  # Installer.app accepts .txt / .rtf / .html.
  license: ../EULA.txt

# ── Linux ───────────────────────────────────────────────────────────────
# .deb + .rpm so the post-install hook can register a systemd system
# unit. AppImage was dropped — it can't install services on first run
# (no install hook), and shipping two install models would confuse users.
# Both formats install to /opt/Gezel/ by default.
linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # Electron derives its Wayland app_id / X11 WM_CLASS from package.json's
  # `desktopName`. Keep the installed desktop filename on that same identity
  # so GNOME/KDE can associate the live window with this entry and use its
  # polished Name + icon instead of showing `bendyline-gezel-app` with a
  # generic gear. electron-builder 26 leaves this opt-in; v27 will default it.
  syncDesktopName: true
  # Without this, electron-builder falls back to the package name and ships
  # `/opt/Gezel/@bendylinegezel-app` plus a matching .desktop file and icon —
  # the `@bendyline/gezel-app` scope mangled into a filename. Set here rather
  # than at the top level on purpose: a top-level value would also rename the
  # macOS binary from `Gezel` to `gezel` inside the signed, notarized bundle.
  # Windows already sets its own under `win:`.
  executableName: gezel
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: Office
  synopsis: Your team of AI craftsmen
  description: Build a crew of named AI companions with distinct roles and tools, then put them to work on your projects. Gezel stores their conversations, memory, and work on your computer as ordinary files.
  # The systemd unit file ships into /opt/Gezel/gezeld.service so the
  # afterInstall script can copy it into /etc/systemd/system/ as root.
  extraFiles:
    - from: installer/gezeld.service
      to: gezeld.service

deb:
  afterInstall: installer/linux/after-install.sh
  afterRemove: installer/linux/after-remove.sh
  # zstd instead of electron-builder's xz default. This follows the platform
  # rather than departing from it: Ubuntu's own archive has shipped
  # zstd-compressed debs since 21.10, and every distro that clears our
  # GLIBC_2.38 floor (docs/native-runtime-requirements.md) ships a dpkg that
  # reads them. Debian's archive still defaults to xz, but Debian 12 cannot
  # run our binaries at all.
  #
  # Measured on the v1.26226.50 arm64 payload (1630 MiB uncompressed):
  #   xz -3    797 MiB   9.6s to decode   (170 MB/s)
  #   zstd 3   886 MiB   2.3s to decode   (719 MB/s)
  # +89 MiB of download buys ~7s of `dpkg --unpack` on a workstation and
  # ~20s on a slower arm64 machine. Deliberate trade: install time is the
  # scarce resource, download size is not. Canonical published the same
  # trade for the same reason (~+9% size, decode under 20% of the time).
  compression: zst
  fpm:
    # MUST accompany `compression: zst`. fpm builds the ZSTD_CLEVEL value the
    # same way it builds GZIP and XZ_OPT — with a leading dash (deb.rb:
    # `"-#{deb_compression_level || 3}"`). That is correct for those two,
    # whose env vars take CLI flags, and wrong for ZSTD_CLEVEL, which takes a
    # bare integer: zstd parses the dash as a sign and selects NEGATIVE level
    # 3, its fast mode. Left alone this ships 1084 MiB instead of 886 MiB,
    # silently — the config reads correctly and only the artifact disagrees.
    #
    # `0` is both the fix and the stable choice: zstd maps level 0 to "use the
    # default" (3), and -0 == 0, so this yields real level 3 whether or not
    # fpm ever repairs the dash. Do NOT raise it — `9` becomes level -9 and
    # ships 1168 MiB, worse than changing nothing.
    #
    # scripts/verify-deb-compression.mjs fails the release if this regresses,
    # because every failure mode here is invisible in the config.
    #
    # Flags must precede the positional file mappings: electron-builder
    # splices this array in ahead of the paths it appends itself.
    - --deb-compression-level
    - '0'
    # Ubuntu App Center does not use the non-standard `License` field that fpm
    # writes into the Debian control record. It reads AppStream metadata instead.
    # Install the upstream metainfo file at its standard system location so the
    # sideload screen can identify Gezel's project license as MIT.
    - assets/com.bendyline.gezel.metainfo.xml=/usr/share/metainfo/com.bendyline.gezel.metainfo.xml
  # Depends on systemd being present — virtually all modern desktop
  # distros use it. List explicitly so package managers refuse to
  # install on init-system-other systems instead of silently failing.
  depends:
    - acl
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - systemd

rpm:
  afterInstall: installer/linux/after-install.sh
  afterRemove: installer/linux/after-remove.sh
  # Keep both native Linux package formats discoverable by AppStream clients.
  fpm:
    - assets/com.bendyline.gezel.metainfo.xml=/usr/share/metainfo/com.bendyline.gezel.metainfo.xml
  depends:
    - acl
    - libnotify
    # Fedora/RHEL package and RPM provide name. `libgtk-3-0` is Debian-only.
    - gtk3
    - libXScrnSaver
    - libXtst
    - libuuid
    - systemd
