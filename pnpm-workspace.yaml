packages:
  - "packages/*"
  - "evals"

publicHoistPattern:
  - "*onnxruntime*"

# Ordinary installs must not silently purge the shared generated dependency
# tree. Only the explicitly confirmed `pnpm deps:repair` path overrides this
# after its frozen-lockfile fetch and fingerprint gate succeeds.
confirmModulesPurge: true

# A build/test command must never turn itself into a surprise install. Multiple
# Codex tasks share this checkout, and concurrent installers can rewrite the
# live node_modules tree out from under running tests. Intentional installs go
# through the explicit dependency commands, which hold the exclusive checkout
# mutation lease. Builds/tests/checks hold compatible shared read leases.
# The root pnpm:devPreinstall hook rejects an accidental bare local install
# before pnpm begins changing node_modules; CI is isolated and exempt.
verifyDepsBeforeRun: warn

# The packageManager pin in package.json is authoritative. Warn immediately
# when the pnpm on PATH differs instead of silently downloading another pnpm
# before the requested command starts (which can look like a hung command).
pmOnFail: warn

# A committed lockfile is part of the trusted base. Do not make every install
# re-query registry metadata for every locked package; run `pnpm audit:lockfile`
# when the release-age and publisher-trust policies need explicit verification.
trustLockfile: true

# Network defaults are sized for a cold CI install of ~1440 packages, not for a
# warm laptop. pnpm's stock 60s fetchTimeout with 2 retries aborted a Windows
# release build outright when large tarballs (onnxruntime, monaco, mermaid,
# @huggingface/transformers) competed for the same connection pool. Lower
# concurrency trades a little warm-cache speed for less pool contention.
fetchTimeout: 300000
fetchRetries: 5
networkConcurrency: 8

# Hold third-party releases for seven days (pnpm counts minutes), the same
# cooldown DocBlocks enforces. Gezel's published packages exact-pin what they
# depend on, so a younger pin here would block every app that installs Gezel
# under that rule until the version aged. Our own `@bendyline/*` packages are
# never held. Gilde stays listed by name because gilde:update looks for it
# there; it still exact-pins each selected release in package.json and the
# lockfile. Version-specific entries admit a third-party release before it has
# aged: the July 2026 sweep, plus the versions already locked when the hold
# rose to seven days on 2026-10-02 — delete those once they are a week old.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@bendyline/*"
  - "@anthropic-ai/sdk@0.113.0"
  - "@bendyline/gilde"
  - "@csstools/css-calc@3.3.0"
  - "@csstools/css-color-parser@4.1.10"
  - "@csstools/css-syntax-patches-for-csstree@1.1.7"
  # First release with EmbeddingGemma 2 (embedding_gemma2); published
  # 2026-10-06, taken before the hold expires by explicit decision.
  - "@huggingface/transformers@4.3.1"
  - "@vitejs/plugin-react@6.0.4"
  - "dompurify@3.4.13"
  - "electron@43.7.7"
  - "jose@6.2.4"
  - "mermaid@11.16.1"
  - "nodemailer@10.0.12"
  - "postcss@8.5.22"
  - "tar@7.5.21"

allowBuilds:
  '@bendyline/gezel-service@file:packages/service': true
  "@biomejs/biome": true
  "electron": true
  "electron-winstaller": true
  "esbuild": true
  "koffi": true
  "node-pty": true
  "onnxruntime-node": true
  "protobufjs": true
  # The sharp slot holds the private no-image stub, which has no build step.
  sharp: false

ignoredOptionalDependencies:
  - "@napi-rs/canvas"

overrides:
  # Keep direct declarations exact when they are covered by an exact override.
  # pnpm's pre-script dependency check compares the original manifest specifier
  # with the override-normalized lockfile importer and otherwise warns even
  # though a frozen install validates successfully.
  "@hono/node-server": "2.0.11"
  # plist (electron-builder) still resolves the 0.8 line.
  "@xmldom/xmldom@<0.9": "0.8.15"
  "adm-zip": "0.6.1"
  "axios": "1.18.1"
  # html-to-text 10.x still declares deepmerge-ts ^7.1.5. Force the patched
  # major until it widens that range (GHSA-ggr8-5vv4-36mx).
  "deepmerge-ts": "8.0.1"
  "dompurify@>=3 <4": "3.4.13"
  "fast-uri": "3.1.8"
  "form-data": "4.0.6"
  "hono": "4.13.9"
  "ip-address": "10.3.1"
  "js-yaml@<4": "3.15.2"
  "js-yaml@>=4 <5": "4.3.2"
  "mermaid@>=11 <12": "11.16.1"
  # mailparser and imapflow pin nodemailer exactly (imapflow 1.4.8 at 9.0.3), so
  # the override keeps one copy that carries the addressparser fixes. 10.0.6
  # fixed GHSA-v53p-9fqp-m79j; 9.x has no backport.
  "nodemailer": "10.0.12"
  # kokoro-js 1.2.1 (the latest release) still declares Transformers.js ^3.5.1.
  # Its whole surface (StyleTextToSpeech2Model, AutoTokenizer, Tensor, RawAudio,
  # env.backends) is unchanged in 4.x, and the service hands it Tensors built
  # from its own copy, so both must resolve to the one 4.x install.
  "kokoro-js>@huggingface/transformers": "^4.3.1"
  # Keep the single Transformers.js 4.x line on the native runtime it pins;
  # the matching adm-zip override closes its transitive advisory.
  "onnxruntime-node": "1.30.0"
  "protobufjs": "7.6.5"
  # express 5 still locks 2.0.7; 2.0.8 fixes GHSA-jqcg-44mw-7w3h.
  "proxy-addr": "2.0.8"
  "qs": "6.15.2"
  "react-router": "7.18.1"
  # kokoro-js pulls in phonemizer, which embeds GPL-3 eSpeak NG. Gezel
  # phonemizes with @bendyline/gezel/kokoro and calls generate_from_ids, so the
  # engine is never used and must not ship; see packages/phonemizer-compat.
  "phonemizer": "workspace:1.2.1"
  # Transformers.js imports Sharp eagerly even for text/audio-only consumers.
  # Gezel deliberately supplies a private no-image workspace implementation;
  # see packages/sharp-compat/README.md.
  "sharp": "workspace:0.35.3"
  "tar": "7.5.21"
  "ws": "8.21.1"

patchedDependencies:
  "app-builder-lib@26.15.3": "patches/app-builder-lib@26.15.3.patch"
