name: 'Install Chromium'
description: >-
  Installs Playwright's Chromium from its CDN, and its system packages from apt
  only when the runner cannot launch it without them.

inputs:
  filter:
    description: 'pnpm filter for the package whose Playwright version to install.'
    required: true

runs:
  using: composite
  steps:
    # GitHub's Ubuntu image already has every library Chromium loads. On it,
    # `--with-deps` only added 9 font packages and 8 patch upgrades (26 MB),
    # and Ubuntu's Azure mirror served them at 24 kB/s often enough to cancel
    # jobs: 10-13 min installs on 2026-10-22 and 10-23. The browser suite
    # passes without those fonts. apt timeouts did not help: the mirror
    # trickles rather than drops.
    - name: Install Chromium
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: |
        set -euo pipefail
        pnpm --filter "$FILTER" exec playwright install chromium
        # Some suites use headless shell, while browser E2E uses full Chromium.
        # Check both so missing libraries cannot slip past the launch probe.
        launch="(async () => { for (const options of [{}, {channel: 'chromium'}]) { const browser = await require('playwright').chromium.launch(options); await browser.close(); } })()"
        if ! pnpm --filter "$FILTER" exec node -e "$launch"; then
          echo "::warning::Chromium cannot launch with this runner's libraries; installing its system packages from apt"
          pnpm --filter "$FILTER" exec playwright install-deps chromium
          pnpm --filter "$FILTER" exec node -e "$launch"
        fi
