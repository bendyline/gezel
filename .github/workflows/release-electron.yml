# Electron release workflow — builds, signs, notarizes, and uploads Gezel
# installers for Windows, macOS, and Linux, then aggregates them into a
# draft GitHub Release. Publishing is deliberately a separate, manual action
# in GitHub so a CI dispatch can never make installers public by accident.
#
# Trigger: manual dispatch. This produces production-signed artifacts but
# always leaves the resulting release as a draft. It fails closed when
# signing or notarization credentials are unavailable.
#
# One-time setup (required for production releases):
#   Windows (Azure Trusted Signing):
#     AZURE_CODE_SIGNING_ENDPOINT — e.g. https://wus2.codesigning.azure.net/
#     AZURE_CODE_SIGNING_ACCOUNT  — Trusted Signing account name
#     AZURE_CERT_PROFILE_NAME     — certificate profile name
#     AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET — service principal
#   macOS (Developer ID + notarization):
#     APPLE_CERTIFICATE_P12_BASE64 — base64-encoded .p12 export. Must yield a
#                           "Developer ID Application" identity (signs the
#                           .app) AND a "Developer ID Installer" identity
#                           (signs the .pkg). One .p12 may carry both.
#     APPLE_CERTIFICATE_PASSWORD   — password for the .p12
#     APPLE_INSTALLER_CERTIFICATE_P12_BASE64 / _PASSWORD — optional second
#                           .p12, only when the Installer identity is exported
#                           separately rather than combined into the above
#     APPLE_ID / APPLE_ID_PASSWORD / APPLE_TEAM_ID — notarization creds
#   Release:
#     GEZEL_RELEASE_TOKEN — fine-grained PAT with Contents: write on the
#                           release repo (defaults to this repo; edit the
#                           `repository:` field below if you publish elsewhere)

name: Release Electron App
run-name: Draft Electron release from ${{ github.ref_name }} with ${{ inputs.nativeTag }}

on:
  workflow_dispatch:
    inputs:
      nativeTag:
        description: 'Required native-binaries tag to bundle (e.g. native-v1.2.3).'
        required: true
        type: string

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.15.1'
  # Matches the Quality workflow. Node sizes its default heap from system
  # memory, so the 16 GB Linux runners get ~4 GiB for free while the 7 GB
  # macos-latest arm64 runner gets ~2 GiB — not enough for tsup's DTS worker
  # over the service bundle, which died with ERR_WORKER_OUT_OF_MEMORY.
  NODE_OPTIONS: '--max-old-space-size=4096'

permissions:
  contents: read

concurrency:
  group: release-electron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    # Only probes the native release assets over the network; a minute is
    # typical. A ceiling here catches a hung API call, nothing more.
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject local workspace links
        run: node scripts/check-no-local-links.mjs

      - name: Require production signing credentials
        env:
          NATIVE_TAG: ${{ inputs.nativeTag }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$NATIVE_TAG" =~ ^native-v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::nativeTag is required and must name a versioned native release (native-vX.Y.Z)"
            exit 1
          fi
          for name in AZURE_CODE_SIGNING_ENDPOINT AZURE_CODE_SIGNING_ACCOUNT AZURE_CERT_PROFILE_NAME AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production release secret: $name"
              exit 1
            fi
          done

      - name: Verify native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NATIVE_TAG: ${{ inputs.nativeTag }}
        run: |
          set -euo pipefail
          version="${NATIVE_TAG#native-v}"
          release="$(gh api "repos/${GH_REPO}/releases/tags/${NATIVE_TAG}")"
          if [ "$(jq -r '.draft' <<<"$release")" != 'false' ]; then
            echo "::error::Native release ${NATIVE_TAG} is still a draft"
            exit 1
          fi

          # The app updater discovers releases through /releases/latest and
          # accepts only a bare `v<semver>` tag (see updater/app-release.ts). A
          # native-v* release sitting in the stable channel therefore does not
          # ship the wrong update — it silently ships *no* update, because
          # discovery returns null and the app reports "no published application
          # release exists yet". That is invisible from the release side, so
          # assert both halves here rather than trusting the publish checkbox.
          if [ "$(jq -r '.prerelease' <<<"$release")" != 'true' ]; then
            echo "::error::Native release ${NATIVE_TAG} is not marked as a prerelease."
            echo "::error::Publishing it can move /releases/latest off the app namespace and"
            echo "::error::break update discovery for every installed client. Fix with:"
            echo "::error::  gh release edit ${NATIVE_TAG} --prerelease"
            exit 1
          fi

          latest_tag="$(gh api "repos/${GH_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -n "$latest_tag" ] && ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::/releases/latest currently resolves to '${latest_tag}', which is not an"
            echo "::error::app release tag. Update discovery is broken for shipped clients right now."
            echo "::error::Mark the offending release as a prerelease before releasing:"
            echo "::error::  gh release edit ${latest_tag} --prerelease"
            exit 1
          fi

          # Derived from scripts/native-payload.mjs, the same table
          # build-native.yml packs against — so a variant added to the
          # native pipeline can't be silently omitted from the installer.
          expected=()
          while read -r key; do
            [[ -n "$key" ]] || continue
            case "$key" in
              win32-*) expected+=("gezel-native-${version}-${key}.zip") ;;
              *)       expected+=("gezel-native-${version}-${key}.tar.gz") ;;
            esac
          done < <(node scripts/check-native-payload.mjs --list-keys)
          expected+=('SHA256SUMS' 'NATIVE_FILE_MANIFESTS.json')
          missing=0
          for name in "${expected[@]}"; do
            if ! jq -e --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release" >/dev/null; then
              echo "::error::Native release ${NATIVE_TAG} is missing ${name}"
              missing=1
            fi
          done
          if (( missing )); then exit 1; fi

          # The Electron package may only reuse the bundled native tree when
          # its source-bundled per-file pins describe this exact release.
          # pin-native-release.mjs updates both files together; catch a missed
          # pin before downloading or signing any installers.
          node scripts/verify-native-file-manifest.mjs \
            --manifest packages/service/src/engines/native-file-manifest.json \
            --release "$version"
          pinned_release="$(
            sed -n "s/^export const NATIVE_ENGINE_RELEASE = '\\([^']*\\)';/\\1/p" \
              packages/service/src/engines/native-manifest.ts
          )"
          if [[ "$pinned_release" != "$version" ]]; then
            echo "::error::nativeTag ${NATIVE_TAG} does not match source-pinned native-v${pinned_release}"
            echo "::error::Run scripts/pin-native-release.mjs ${NATIVE_TAG} before releasing Electron."
            exit 1
          fi

      - name: Determine release version
        id: version
        run: |
          version="$(node scripts/stamp-version.mjs --inc "$GITHUB_RUN_NUMBER" --print)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Draft release version: $version" >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: release-preflight
    runs-on: ubuntu-latest
    # ~21 min observed green (Test alone is 12.4). Room for the suite to
    # grow without the ceiling becoming the thing that fails.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          check-local-links: 'false'
      - name: Stamp release version
        run: node scripts/stamp-version.mjs --version "${{ needs.release-preflight.outputs.version }}"
      - name: Build workspace
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Install Chromium
        # Must precede the unit suites, not just the E2E steps: the evals
        # runtime-validation scenarios (petshop, tictactoe, codebase-evolution)
        # launch a real headless chromium inside `pnpm test:ci`. Installing it
        # afterwards left them failing against an absent browser. Same
        # playwright version as the app package, so this one install populates
        # the shared ~/.cache/ms-playwright for the E2E steps below too.
        run: pnpm --filter @bendyline/gezel-app exec playwright install --with-deps chromium
      - name: Test
        # test:ci, not test — same 4-vCPU runner as the Quality workflow, and
        # the same contention that starved fixed test timeouts there.
        run: pnpm test:ci
      - name: Full browser E2E
        run: pnpm test:e2e:web:run
      - name: Full Electron E2E
        run: xvfb-run -a pnpm test:e2e:run
      - name: Generate production SBOM
        run: pnpm audit:sbom
      - name: Verify release version propagation
        run: |
          node scripts/verify-release-version.mjs \
            --version "${{ needs.release-preflight.outputs.version }}" \
            --sbom artifacts/gezel.cdx.json
      - name: Production dependency vulnerability gate
        # critical matches the PR-time gate in quality.yml — the two must
        # stay in lockstep so a release never fails on something CI passed.
        run: pnpm audit:vulnerabilities --audit-level=critical
      - name: Dependency license policy gate
        run: pnpm audit:licenses
      - name: Preserve supply-chain inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: artifacts/gezel.cdx.json
          # `pnpm audit:sbom` writes this file and the audit gates below read
          # it, so a green run cannot reach here without it. Erroring only
          # fired when an earlier step had already failed, stacking a second
          # misleading failure on top of the real one.
          if-no-files-found: ignore
          retention-days: 30

  # ── Windows ───────────────────────────────────────────────────────────
  build-windows:
    needs: [quality, release-preflight]
    runs-on: windows-latest
    # Unproven end-to-end: the signing sweep plus NSIS and installer
    # signing have never both completed. Sized off the Linux build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          check-local-links: 'false'

      - name: Stamp release version
        run: node scripts/stamp-version.mjs --version "${{ needs.release-preflight.outputs.version }}"

      - name: Stage native engine binaries (Windows)
        shell: bash
        env:
          # Script auth: tries GEZEL_GITHUB_TOKEN first, falls back to
          # GITHUB_TOKEN, then `gh auth token`. github.token gives the
          # workflow `contents:read` scope which is enough for downloading
          # release assets in the same repo.
          GEZEL_GITHUB_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ inputs.nativeTag }}
        run: |
          set -euo pipefail
          # Delegated to scripts/fetch-native-binaries.mjs so the local
          # `node scripts/fetch-native-binaries.mjs` flow and CI use the
          # same staging code — drift between the two has bitten before
          # (variant filename matching, multi-zip handling, target dir).
          version="${NATIVE_TAG#native-v}"
          node scripts/fetch-native-binaries.mjs --version "$version"
          ls -la packages/app/native-bin/

      - name: Verify staged native payload is complete
        shell: bash
        # The preflight proved every archive exists; this proves this
        # host's archives unpacked into the engine binaries the installer
        # is supposed to carry. Missing-asset handling in the fetch script
        # is warn-and-skip by design (a platform need not ship every
        # variant), so without this a partial stage would package quietly.
        env:
          NATIVE_TAG: ${{ inputs.nativeTag }}
        run: |
          version="${NATIVE_TAG#native-v}"
          node scripts/check-native-payload.mjs --root packages/app/native-bin
          node scripts/verify-native-file-manifest.mjs \
            --root packages/app/native-bin \
            --manifest packages/service/src/engines/native-file-manifest.json \
            --release "$version"

      - name: Verify Authenticode on staged native binaries
        shell: pwsh
        run: |
          # The native build workflow signs every engine exe we compile at
          # birth (Azure Trusted Signing). fetch-native-binaries.mjs proved
          # the bytes match SHA256SUMS; this proves those bytes carry a valid
          # signature — a native release built without signing secrets
          # (fork/dispatch build) must never reach a production installer.
          #
          # Vendor binaries staged alongside them are exempt by the same
          # sign-only-what-we-compile policy the afterPack sweep uses: uv.exe
          # is Astral's prebuilt release and ships unsigned, as they publish
          # it. Same list, same module — see third-party-binaries.cjs.
          $patterns = node packages/app/scripts/third-party-binaries.cjs --patterns | ConvertFrom-Json
          if (-not $patterns) { throw 'third-party-binaries.cjs --patterns returned nothing' }
          $extensions = node packages/app/scripts/third-party-binaries.cjs --extensions | ConvertFrom-Json
          if (-not $extensions) { throw 'third-party-binaries.cjs --extensions returned nothing' }
          $nativeCode = Get-ChildItem 'packages/app/native-bin' -Recurse -File |
            Where-Object { $extensions -contains $_.Extension.ToLowerInvariant() }
          if ($nativeCode.Count -eq 0) { throw 'No native executable/loadable binaries staged' }
          $verified = 0
          foreach ($exe in $nativeCode) {
            $isThirdParty = $false
            foreach ($p in $patterns) { if ($exe.Name -imatch $p) { $isThirdParty = $true; break } }
            if ($isThirdParty) {
              Write-Host "[native] third-party, left unsigned by policy: $($exe.Name)"
              continue
            }
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ($sig.Status -ne 'Valid') {
              throw "Unsigned/invalid native binary $($exe.FullName): $($sig.Status)"
            }
            Write-Host "[native] valid signature: $($exe.Name)"
            $verified += 1
          }
          if ($verified -eq 0) { throw 'No first-party native binaries were signature-verified' }

      - name: Build + produce service bundle
        # The bundle is sealed into service-bundle.tar.gz here, and neither the
        # afterPack sweep nor "Verify Windows signatures" below can see inside a
        # tarball. scripts/verify-pe-tree.mjs therefore audits the tree while it
        # is still loose: every PE binary must be validly signed or on the
        # third-party allowlist. REQUIRE=1 so a runner without the Windows SDK
        # fails the release instead of silently verifying nothing.
        run: pnpm build:packaged
        env:
          GEZEL_REQUIRE_BUNDLE_PE_VERIFY: '1'

      - name: Verify release version propagation
        shell: bash
        run: |
          node scripts/verify-release-version.mjs \
            --version "${{ needs.release-preflight.outputs.version }}" \
            --service-meta packages/app/dist/service-bundle.meta.json

      - name: Verify service host staged (Windows Service host)
        shell: pwsh
        run: |
          # gezel-service-host is the first-party GezelService host,
          # built + signed by the native pipeline and staged by
          # fetch-native-binaries.mjs. electron-builder ships it via
          # win.extraFiles; if it's missing here the installer would
          # build fine but never register the machine service — fail
          # loud instead of shipping a service-less installer.
          $host_exe = 'packages/app/native-bin/win32-x64/gezel-service-host.exe'
          if (!(Test-Path $host_exe)) { throw "[service-host] missing $host_exe — native release did not include the service host" }
          Write-Host "[service-host] staged $host_exe"

          # Present is not enough: the host compiles the daemon's launch
          # environment in, but it is built from a separately-tagged native
          # release. When that pin lags a change to main.cpp, the two disagree
          # silently — v1.26217.38 shipped a host predating
          # GEZEL_SERVICE_ROLE, so every Windows machine service ran the full
          # product API instead of the inference-only broker. The binary's own
          # --self-test cannot catch this (same stale source, same stale
          # assertions) and it carries no version resource to compare.
          node scripts/verify-service-host-contract.mjs $host_exe
          if ($LASTEXITCODE -ne 0) { throw '[service-host] launch contract mismatch — the pinned native release is stale' }

      - name: Install Trusted Signing SDK
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: |
          if (-not $env:SIGNING_ENDPOINT) { throw '[signing] missing endpoint' }
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 `
            -OutputDirectory "${{ runner.temp }}\TrustedSigning"
          $dlibDir = Get-ChildItem "${{ runner.temp }}\TrustedSigning\Microsoft.Trusted.Signing.Client.*\bin\x64" -Directory | Select-Object -First 1
          echo "TRUSTED_SIGNING_DLIB_PATH=$($dlibDir.FullName)\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          $metadata = @{
            Endpoint = "$env:SIGNING_ENDPOINT"
            CodeSigningAccountName = "$env:SIGNING_ACCOUNT"
            CertificateProfileName = "$env:SIGNING_PROFILE"
          } | ConvertTo-Json
          $metadataPath = "${{ runner.temp }}\metadata.json"
          Set-Content -Path $metadataPath -Value $metadata
          echo "TRUSTED_SIGNING_METADATA_PATH=$metadataPath" >> $env:GITHUB_ENV

      # The shipped engine DLLs import MSVCP140/VCRUNTIME140 — the MSVC
      # redistributable, which is not a Windows component. Stage Microsoft's
      # installer so the NSIS customInstall hook can provision it; without
      # this the DLLs fail to load on a clean machine and local models never
      # start. REQUIRED=1 so a release fails here rather than shipping an
      # installer that silently omits it.
      - name: Stage Visual C++ redistributable
        run: node packages/app/scripts/stage-vc-redist.mjs
        env:
          GEZEL_VCREDIST_REQUIRED: '1'

      - name: Package Windows installer
        run: pnpm --filter @bendyline/gezel-app exec electron-builder --win --publish never
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Smoke-test packaged Windows app
        shell: pwsh
        env:
          GEZEL_PACKAGED_SMOKE: '1'
          GEZEL_EXPECTED_VERSION: ${{ needs.release-preflight.outputs.version }}
          GEZEL_HOME: ${{ runner.temp }}\gezel-packaged-smoke
        run: |
          $exe = Get-Item 'packages/app/dist/installers/win-unpacked/gezel.exe' -ErrorAction Stop
          $stdout = Join-Path $env:RUNNER_TEMP 'gezel-packaged-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'gezel-packaged-smoke.stderr.log'
          Remove-Item -LiteralPath $stdout, $stderr -Force -ErrorAction SilentlyContinue

          function Write-PackagedSmokeLog([string]$label, [string]$path) {
            Write-Host "::group::$label"
            if (Test-Path -LiteralPath $path) {
              Get-Content -LiteralPath $path -Tail 400
            } else {
              Write-Host "(no log file was created)"
            }
            Write-Host '::endgroup::'
          }

          $arguments = @(
            '--gezel-packaged-smoke'
            "--gezel-expected-version=${{ needs.release-preflight.outputs.version }}"
            "--gezel-home=${{ runner.temp }}\gezel-packaged-smoke"
          )
          $process = Start-Process `
            -FilePath $exe.FullName `
            -ArgumentList $arguments `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          if (-not $process.WaitForExit(360000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            [void]$process.WaitForExit(10000)
            Write-PackagedSmokeLog 'Packaged smoke stdout' $stdout
            Write-PackagedSmokeLog 'Packaged smoke stderr' $stderr
            throw 'Packaged Electron smoke test timed out after 360 seconds'
          }
          # Flush redirected streams before reading the files or ExitCode.
          $process.WaitForExit()
          Write-PackagedSmokeLog 'Packaged smoke stdout' $stdout
          Write-PackagedSmokeLog 'Packaged smoke stderr' $stderr
          if ($process.ExitCode -ne 0) {
            throw "Packaged Electron smoke test failed with exit code $($process.ExitCode)"
          }
          Write-Host "[packaged-smoke] Windows app imported and reached ready"

      # The normal Windows artifact upload is skipped after a smoke failure.
      # Preserve both sides of the archive boundary so the next failure can be
      # classified without guessing: the shipped tarball plus the dependency
      # directories produced by extraction on the runner.
      - name: Preserve Windows packaged-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-packaged-smoke-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gezel-packaged-smoke.stdout.log
            ${{ runner.temp }}/gezel-packaged-smoke.stderr.log
            ${{ runner.temp }}/gezel-packaged-smoke/service/node_modules/entities
            ${{ runner.temp }}/gezel-packaged-smoke/service/node_modules/parse5
            packages/app/dist/service-bundle.tar.gz
            packages/app/dist/service-bundle.meta.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          # Everything we build must be validly signed: the installer and
          # gezel.exe (electron-builder's own pass), our engine DLLs (the
          # afterPack sweep in scripts/after-pack.cjs), and the native engine
          # exes + gezel-service-host.exe (signed at birth). Anything
          # Unsigned here means the sweep regressed — fail the release.
          #
          # Third-party binaries we redistribute verbatim are exempt: we sign
          # what we compile, so NVIDIA's cuBLAS/cudart, uv.exe, and pnpm's
          # optional fastlist helpers ship exactly as their vendors released
          # them. Bundled node.exe is also kept
          # byte-identical, but its existing OpenJS Authenticode signature is
          # explicitly validated below. The allowlist comes from
          # scripts/third-party-binaries.cjs
          # so this gate and the sweep cannot drift apart. It is an explicit
          # allowlist, not "ignore unsigned" — a first-party DLL that failed
          # to get signed still fails here.
          $patterns = node packages/app/scripts/third-party-binaries.cjs --patterns | ConvertFrom-Json
          if (-not $patterns) { throw 'third-party-binaries.cjs --patterns returned nothing' }
          $extensions = node packages/app/scripts/third-party-binaries.cjs --extensions | ConvertFrom-Json
          if (-not $extensions) { throw 'third-party-binaries.cjs --extensions returned nothing' }
          function Test-ThirdParty([string]$name) {
            foreach ($p in $patterns) { if ($name -imatch $p) { return $true } }
            return $false
          }
          $installers = Get-ChildItem 'packages/app/dist/installers/*.exe'
          if ($installers.Count -eq 0) { throw 'No Windows installer produced' }
          $unpacked = 'packages/app/dist/installers/win-unpacked'
          $payload = @(
            Get-Item "$unpacked/gezel.exe" -ErrorAction Stop
            Get-Item "$unpacked/gezel-service-host.exe" -ErrorAction Stop
          )
          $payload += Get-ChildItem "$unpacked/resources/app.asar.unpacked" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $extensions -contains $_.Extension.ToLowerInvariant() }
          $checked = 0
          $skipped = @()
          foreach ($executable in @($installers) + $payload) {
            if ($executable.Name -ieq 'node.exe') {
              $signature = Get-AuthenticodeSignature $executable.FullName
              if ($signature.Status -ne 'Valid') {
                throw "Invalid upstream Authenticode signature for $($executable.FullName): $($signature.Status)"
              }
              if ($signature.SignerCertificate.Subject -notmatch 'O=OpenJS Foundation(?:,|$)') {
                throw "Unexpected node.exe signer for $($executable.FullName): $($signature.SignerCertificate.Subject)"
              }
              $checked += 1
              continue
            }
            if (Test-ThirdParty $executable.Name) {
              $skipped += $executable.Name
              continue
            }
            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($executable.FullName): $($signature.Status)"
            }
            $checked += 1
          }
          Write-Host "Verified $checked signed files"
          if ($skipped.Count -gt 0) {
            Write-Host "Left unsigned by policy (third-party, shipped verbatim): $(($skipped | Sort-Object -Unique) -join ', ')"
          }

      - name: Verify Windows installer legal payload
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'packages/app/dist/installers/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer produced' }
          $nativeVersion = '${{ inputs.nativeTag }}' -replace '^native-v', ''
          node scripts/verify-installer-licenses.mjs $installer.FullName `
            --native-source packages/app/native-bin `
            --native-manifest packages/service/src/engines/native-file-manifest.json `
            --native-release $nativeVersion
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer payload verification failed' }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-artifacts
          path: |
            packages/app/dist/installers/*.exe
            packages/app/dist/installers/*.exe.blockmap
            packages/app/dist/installers/latest.yml
          if-no-files-found: error
          retention-days: 7

  # ── macOS ─────────────────────────────────────────────────────────────
  # Apple Silicon (arm64) only. We dropped Intel Mac (macos-13 / x64)
  # because: (a) Apple's own support for Intel is wrapping up, (b) the
  # macos-13 runner pool is scarce + slow in CI, (c) on-device first-run
  # routes Intel Mac users to Copilot/OpenAI (see
  # `bootstrapOnDeviceFirstRun`) so the on-device engines aren't built
  # for it either (see native/build-native.yml's matrix). One arch =
  # one PKG, with no cross-architecture manifest merge step.
  build-macos:
    needs: [quality, release-preflight]
    runs-on: macos-latest
    # Widest of the six. electron-builder notarizes the .app and the .pkg
    # separately, and one rejected submission alone took 13.5 min — two
    # round-trips through Apple's service is the realistic worst case.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          check-local-links: 'false'

      - name: Stamp release version
        run: node scripts/stamp-version.mjs --version "${{ needs.release-preflight.outputs.version }}"

      - name: Stage native engine binaries (macOS)
        env:
          GEZEL_GITHUB_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ inputs.nativeTag }}
        run: |
          set -euo pipefail
          # See the Windows job above for why this delegates to the
          # script — same source of truth for variant filename matching,
          # multi-archive handling, and target dir.
          version="${NATIVE_TAG#native-v}"
          node scripts/fetch-native-binaries.mjs --version "$version"
          ls -la packages/app/native-bin/

      - name: Verify staged native payload is complete
        env:
          NATIVE_TAG: ${{ inputs.nativeTag }}
        run: |
          version="${NATIVE_TAG#native-v}"
          node scripts/check-native-payload.mjs --root packages/app/native-bin
          node scripts/verify-native-file-manifest.mjs \
            --root packages/app/native-bin \
            --manifest packages/service/src/engines/native-file-manifest.json \
            --release "$version"

      - name: Verify Developer ID signatures on staged native binaries
        run: |
          set -euo pipefail
          # The native build workflow signs every Mach-O (engine exes and
          # peer dylibs) at birth with the Developer ID cert. The fetch
          # script proved bytes match SHA256SUMS; this proves the bytes
          # are signed — an unsigned native release (built without
          # secrets) must never reach a production installer.
          count=0
          while IFS= read -r bin; do
            if file -b "$bin" | grep -q 'Mach-O'; then
              codesign --verify --strict "$bin" \
                || { echo "::error::unsigned/invalid native binary: $bin"; exit 1; }
              count=$((count + 1))
            fi
          done < <(find packages/app/native-bin -type f)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::no Mach-O binaries staged under packages/app/native-bin"
            exit 1
          fi
          echo "verified $count signed Mach-O binaries"

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Optional second .p12 holding the "Developer ID Installer" identity.
          # Not needed when APPLE_CERTIFICATE_P12_BASE64 already exports both
          # identities in one file — either arrangement satisfies the assertion
          # in the next step.
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          if [ -n "${APPLE_INSTALLER_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "$APPLE_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/installer-certificate.p12
            security import $RUNNER_TEMP/installer-certificate.p12 \
              -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Verify both Apple signing identities are present
        # electron-builder signs the .app with "Developer ID Application" and
        # the .pkg with "Developer ID Installer" — two distinct certificates.
        # When the installer one is missing it does not warn: it just emits an
        # unsigned .pkg, and the failure surfaces ~24 min later as a notarytool
        # rejection reading only "The binary is not signed." Fail here instead,
        # in seconds, naming what to add.
        run: |
          set -euo pipefail
          identities=$(security find-identity -v "$RUNNER_TEMP/app-signing.keychain-db")
          for kind in 'Developer ID Application' 'Developer ID Installer'; do
            if ! grep -q "$kind" <<<"$identities"; then
              echo "::error::No \"$kind\" identity in the signing keychain. Export it"
              echo "::error::from Apple Developer as .p12 and add it to the repository"
              echo "::error::secrets — either combined into APPLE_CERTIFICATE_P12_BASE64"
              echo "::error::or separately as APPLE_INSTALLER_CERTIFICATE_P12_BASE64."
              exit 1
            fi
          done
          echo "both Developer ID identities present"

      - name: Build + produce service bundle
        # Runs after the certificate import, not before: the native modules
        # inside service-bundle.tar.gz have to be Developer ID-signed before
        # the tarball is sealed. electron-builder cannot see into the archive
        # afterwards, but Apple's notary service can — and rejected the build
        # over 15 unsigned binaries in there.
        run: pnpm build:packaged
        env:
          GEZEL_MACOS_SIGN_BUNDLE: '1'

      - name: Verify release version propagation
        run: |
          node scripts/verify-release-version.mjs \
            --version "${{ needs.release-preflight.outputs.version }}" \
            --service-meta packages/app/dist/service-bundle.meta.json

      - name: Package macOS installer
        # Raise fd limits — codesign opens all .app files concurrently and
        # hits EMFILE otherwise (same treatment qualla-internal uses).
        # `--arm64` constrains electron-builder to Apple Silicon even if
        # electron-builder.yml still lists both archs.
        run: |
          sudo launchctl limit maxfiles 524288 524288
          ulimit -n 524288
          pnpm --filter @bendyline/gezel-app exec electron-builder --mac --arm64 --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # electron-builder 26 reads this exact variable and notarizes both
          # the .app and final .pkg. The repository secret keeps its existing
          # name; only the process environment name changes here.
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UV_THREADPOOL_SIZE: 16

      - name: Verify macOS signing and notarization
        run: |
          set -euo pipefail
          pkg=$(find packages/app/dist/installers -maxdepth 1 -name '*.pkg' -print -quit)
          test -n "$pkg"
          pkgutil --check-signature "$pkg"
          spctl --assess --type install --verbose=4 "$pkg"
          xcrun stapler validate "$pkg"

          # Also verify the packaged .app payload directly: the deep check
          # covers every nested Mach-O (including asar-unpacked native-bin
          # binaries retained with their born-signed bytes), while the outer
          # app signature seals their files and symlink metadata into the
          # bundle. This proves the whole app, not just the outer .pkg.
          app=$(find packages/app/dist/installers -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          node scripts/verify-macos-entitlements.mjs "$app"
          node scripts/verify-macos-version-floor.mjs "$app" 13.5
          # electron-builder hardcodes a blanket NSAllowsArbitraryLoads that
          # `mac.extendInfo` cannot override; an afterPack hook narrows it just
          # before codesign. Dropping that hook still packs, signs and
          # notarizes cleanly, so assert the shipped plist rather than trust it.
          node scripts/verify-macos-ats.mjs "$app"

          # The official Node runtime arrives signed/notarized by the Node.js
          # Foundation, and fetch-node.mjs records its vendor bytes before
          # packaging. electron-builder must preserve both: re-signing Node
          # changes its sha256 and makes the supervisor reject it at startup.
          node_bundle="$app/Contents/Resources/app.asar.unpacked/dist/node-bundle"
          test -x "$node_bundle/node"
          test -f "$node_bundle/sha256.txt"
          (
            cd "$node_bundle"
            shasum -a 256 -c sha256.txt
          )
          codesign --verify --strict --check-notarization --verbose=2 "$node_bundle/node"
          node_signature=$(codesign --display --verbose=4 "$node_bundle/node" 2>&1)
          if ! grep -Fq 'TeamIdentifier=HX7739G8FX' <<<"$node_signature"; then
            echo "::error::Packaged Node runtime no longer carries the Node.js Foundation signature"
            echo "$node_signature"
            exit 1
          fi
          echo "verified packaged Node bytes and upstream signature"

      - name: Smoke-test packaged macOS app
        env:
          GEZEL_PACKAGED_SMOKE: '1'
          GEZEL_EXPECTED_VERSION: ${{ needs.release-preflight.outputs.version }}
          GEZEL_HOME: ${{ runner.temp }}/gezel-packaged-smoke
        run: |
          set -euo pipefail
          app=$(find packages/app/dist/installers -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app"
          "$app/Contents/MacOS/Gezel" \
            --gezel-packaged-smoke \
            --gezel-expected-version="${{ needs.release-preflight.outputs.version }}" \
            --gezel-home="${{ runner.temp }}/gezel-packaged-smoke" &
          pid=$!
          deadline=$((SECONDS + 180))
          while kill -0 "$pid" 2>/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::packaged Electron smoke test timed out after 180 seconds"
              kill -TERM "$pid" 2>/dev/null || true
              sleep 2
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" || true
              exit 1
            fi
            sleep 1
          done
          wait "$pid"

      - name: Smoke-test macOS PKG install and recovery
        env:
          GEZEL_EXPECTED_VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          set -euo pipefail
          pkg=$(find packages/app/dist/installers -maxdepth 1 -name '*.pkg' -print -quit)
          test -n "$pkg"

          daemon_label=com.bendyline.gezeld
          data_dir="/Library/Application Support/Gezel"
          runtime_dir="$data_dir/runtime"
          uninstaller="/Applications/Gezel.app/Contents/Resources/uninstall.sh"

          dump_pkg_diagnostics() {
            set +e
            echo "::group::macOS Installer log"
            sudo tail -n 400 /var/log/install.log 2>&1 || true
            echo "::endgroup::"

            echo "::group::macOS PackageKit unified log"
            sudo /usr/bin/log show \
              --style compact \
              --last 10m \
              --predicate \
                'process == "installer" OR process == "installd" OR process == "package_script_service"' \
              2>&1 | tail -n 400 || true
            echo "::endgroup::"

            echo "::group::Partial Gezel install state"
            sudo dscl . -read /Users/_gezeld 2>&1 || true
            sudo dscl . -read /Groups/_gezeld 2>&1 || true
            sudo launchctl print "system/$daemon_label" 2>&1 || true
            sudo ls -lde \
              "/Applications/Gezel.app" \
              "$data_dir" \
              "$runtime_dir" \
              2>&1 || true
            echo "::endgroup::"
            set -e
          }

          install_pkg() {
            description="$1"
            echo "$description"
            set +e
            sudo /usr/sbin/installer -pkg "$pkg" -target /
            installer_status=$?
            set -e
            if [[ "$installer_status" -eq 0 ]]; then
              return 0
            fi

            echo "::error::macOS PKG installer failed during: $description (exit $installer_status)"
            dump_pkg_diagnostics
            return "$installer_status"
          }

          cleanup() {
            set +e
            if [[ -f "$uninstaller" ]]; then
              sudo /bin/bash "$uninstaller" --purge-data
            else
              # The installer can fail after creating script-owned state but
              # before the app payload is available. Keep the ephemeral runner
              # clean even in that partial state.
              sudo launchctl bootout "system/$daemon_label" 2>/dev/null || true
              sudo launchctl enable "system/$daemon_label" 2>/dev/null || true
              sudo rm -f "/Library/LaunchDaemons/$daemon_label.plist"
              sudo rm -rf "/Applications/Gezel.app" "$data_dir"
              sudo dscl . -delete /Users/_gezeld 2>/dev/null || true
              sudo dscl . -delete /Groups/_gezeld 2>/dev/null || true
            fi
            return 0
          }
          trap cleanup EXIT

          assert_installed_health() {
            deadline=$((SECONDS + 90))
            while (( SECONDS < deadline )); do
              if sudo launchctl print "system/$daemon_label" >/dev/null 2>&1 && \
                 [[ -s "$runtime_dir/port" ]] && [[ -s "$runtime_dir/cert.pem" ]]; then
                port=$(awk 'NR == 1 { print $1 }' "$runtime_dir/port")
                if [[ "$port" =~ ^[0-9]+$ ]]; then
                  if health=$(
                    /usr/bin/curl \
                      --fail \
                      --silent \
                      --show-error \
                      --connect-timeout 2 \
                      --max-time 3 \
                      --cacert "$runtime_dir/cert.pem" \
                      "https://127.0.0.1:${port}/api/health" 2>/dev/null
                  ); then
                    if grep -Fq '"ok":true' <<<"$health" && \
                       grep -Fq "\"version\":\"$GEZEL_EXPECTED_VERSION\"" <<<"$health"; then
                      echo "verified installed PKG health: $health"
                      return 0
                    fi
                  fi
                fi
              fi
              sleep 1
            done

            echo "::error::installed PKG did not expose expected service health"
            sudo launchctl print "system/$daemon_label" || true
            sudo tail -n 100 "$data_dir/logs/service-stderr.log" 2>/dev/null || true
            sudo tail -n 100 "$data_dir/logs/service-stdout.log" 2>/dev/null || true
            dump_pkg_diagnostics
            return 1
          }

          install_pkg "installing PKG from a clean machine state"
          assert_installed_health

          install_pkg "reinstalling the same PKG to prove idempotency"
          assert_installed_health

          echo "persistently disabling the service to exercise recovery"
          sudo launchctl disable "system/$daemon_label"
          if ! sudo launchctl print-disabled system | grep -Fq "\"$daemon_label\" => disabled"; then
            echo "::error::failed to establish the disabled-state recovery precondition"
            exit 1
          fi
          install_pkg "reinstalling the PKG to recover a persistently disabled service"
          assert_installed_health

      - name: Verify macOS update metadata was generated
        run: |
          set -euo pipefail
          pkg=$(find packages/app/dist/installers -maxdepth 1 -name '*.pkg' -print -quit)
          zip=$(find packages/app/dist/installers -maxdepth 1 -name '*.zip' -print -quit)
          blockmap=$(find packages/app/dist/installers -maxdepth 1 -name '*.zip.blockmap' -print -quit)
          metadata=packages/app/dist/installers/latest-mac.yml
          test -n "$pkg"
          test -n "$zip"
          test -n "$blockmap"
          test -f "$metadata"
          if ! grep -Fq "$(basename "$zip")" "$metadata"; then
            echo "::error::$metadata does not reference $(basename "$zip")"
            exit 1
          fi
          echo "verified PKG first-install artifact and ZIP-based macOS update feed"

      - name: Verify macOS installer legal payload
        run: |
          set -euo pipefail
          pkg=$(find packages/app/dist/installers -maxdepth 1 -name '*.pkg' -print -quit)
          test -n "$pkg"
          version="${{ inputs.nativeTag }}"
          version="${version#native-v}"
          node scripts/verify-installer-licenses.mjs "$pkg" \
            --native-source packages/app/native-bin \
            --native-manifest packages/service/src/engines/native-file-manifest.json \
            --native-release "$version"

      - name: Tear down keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-artifacts
          path: |
            packages/app/dist/installers/*.pkg
            packages/app/dist/installers/*.zip
            packages/app/dist/installers/*.zip.blockmap
            packages/app/dist/installers/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  # ── Linux ─────────────────────────────────────────────────────────────
  # One job per arch — each runs on its native runner so pnpm installs
  # the matching arch's native deps (the @napi-rs/canvas and friends
  # are optionalDependencies, only the host's arch is on disk after
  # `pnpm install`). Cross-building x64→arm64 on an x64 runner produces
  # an installer whose canvas binary is wrong/missing; one matrix
  # entry per native runner avoids that whole class of bug.
  #
  # `--linux deb:${arch} rpm:${arch}` constrains electron-builder to
  # one arch even though electron-builder.yml lists both. Same pattern
  # the macOS job uses with `--mac --arm64`. Without the arch-scoped
  # target, both matrix entries would try to build both archs each.
  build-linux:
    needs: [quality, release-preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # arm64 completed green in 20 min (15.3 of it packaging). The x64 leg
    # of this same matrix then hung indefinitely, which is why this exists.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          check-local-links: 'false'

      - name: Stamp release version
        run: node scripts/stamp-version.mjs --version "${{ needs.release-preflight.outputs.version }}"

      - name: Stage native engine binaries (Linux)
        env:
          GEZEL_GITHUB_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ inputs.nativeTag }}
        run: |
          set -euo pipefail
          # See the Windows job above for why this delegates to the
          # script — same source of truth for variant filename matching,
          # multi-archive handling, and target dir. fetch-native-binaries
          # auto-detects the host arch and pulls only the matching
          # native-bin/<platform>[-variant]/ subtrees, so each matrix
          # entry ends up with the right engines (linux-x64* on x64,
          # linux-arm64* on arm64) without per-arch wiring here.
          version="${NATIVE_TAG#native-v}"
          node scripts/fetch-native-binaries.mjs --version "$version"
          ls -la packages/app/native-bin/

      - name: Verify staged native payload is complete
        env:
          NATIVE_TAG: ${{ inputs.nativeTag }}
        run: |
          version="${NATIVE_TAG#native-v}"
          node scripts/check-native-payload.mjs --root packages/app/native-bin
          node scripts/verify-native-file-manifest.mjs \
            --root packages/app/native-bin \
            --manifest packages/service/src/engines/native-file-manifest.json \
            --release "$version"

      - name: Build + produce service bundle
        run: pnpm build:packaged

      - name: Verify release version propagation
        run: |
          node scripts/verify-release-version.mjs \
            --version "${{ needs.release-preflight.outputs.version }}" \
            --service-meta packages/app/dist/service-bundle.meta.json

      # electron-builder's rpm target shells out to `rpmbuild` via fpm.
      # The x64 `ubuntu-latest` image has historically shipped `rpm`,
      # but the new `ubuntu-24.04-arm` image does not — leaving it out
      # makes the rpm step fail with "Need executable 'rpmbuild' to
      # convert dir to rpm" only on the arm64 matrix entry, which is
      # exactly the bug that bit a local arm64 build. Installing on
      # both arches is idempotent and removes the implicit
      # runner-image assumption.
      - name: Install RPM and AppStream tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm cpio appstream

      - name: Validate Linux AppStream metadata
        run: appstreamcli validate packages/app/assets/com.bendyline.gezel.metainfo.xml

      - name: Package Linux installer
        run: pnpm --filter @bendyline/gezel-app exec electron-builder --linux deb:${{ matrix.arch }} rpm:${{ matrix.arch }} --publish never

      - name: Verify RPM dependency contract
        run: |
          set -euo pipefail
          found=0
          for installer in packages/app/dist/installers/*.rpm; do
            [[ -f "$installer" ]] || continue
            found=1
            requirements=$(rpm -qpR "$installer")
            if grep -Fxq 'libgtk-3-0' <<<"$requirements"; then
              echo "::error::$installer declares Debian-only dependency libgtk-3-0"
              exit 1
            fi
            if ! grep -Fxq 'gtk3' <<<"$requirements"; then
              echo "::error::$installer does not declare the Fedora/RHEL gtk3 dependency"
              exit 1
            fi
          done
          [[ "$found" == "1" ]]

      - name: Smoke-test packaged Linux app
        env:
          GEZEL_PACKAGED_SMOKE: '1'
          GEZEL_EXPECTED_VERSION: ${{ needs.release-preflight.outputs.version }}
          GEZEL_HOME: ${{ runner.temp }}/gezel-packaged-smoke
        run: |
          set -euo pipefail
          installer=$(find packages/app/dist/installers -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$installer"
          sudo apt-get install -y "$(realpath "$installer")"
          executable=/opt/Gezel/gezel
          test -x "$executable"
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a "$executable" \
            --gezel-packaged-smoke \
            --gezel-expected-version="${{ needs.release-preflight.outputs.version }}" \
            --gezel-home="${{ runner.temp }}/gezel-packaged-smoke"

      - name: Verify Linux installer legal payloads
        run: |
          set -euo pipefail
          found=0
          for installer in packages/app/dist/installers/*.deb packages/app/dist/installers/*.rpm; do
            [[ -f "$installer" ]] || continue
            found=1
            version="${{ inputs.nativeTag }}"
            version="${version#native-v}"
            node scripts/verify-installer-licenses.mjs "$installer" \
              --native-source packages/app/native-bin \
              --native-manifest packages/service/src/engines/native-file-manifest.json \
              --native-release "$version"
          done
          [[ "$found" == "1" ]]

      # electron-updater 6 ships DebUpdater/RpmUpdater and picks one by
      # reading `resources/package-type`, which electron-builder already
      # writes into the package. FpmTarget sets `isWriteUpdateInfo: true`, and
      # update-info generation is deliberately independent of `--publish`
      # ("file should be generated regardless of publish state"), so these
      # manifests exist even though the release packages with `--publish
      # never`. They were being generated and then dropped, because the
      # upload below only globbed .deb/.rpm — which is why Linux had no
      # update channel despite having a working updater.
      #
      # Asserted rather than assumed: upload-artifact succeeds as long as ANY
      # pattern matches, so a missing manifest would silently ship a release
      # with no Linux feed — exactly the bug this replaces.
      - name: Verify Linux update metadata was generated
        run: |
          set -euo pipefail
          ls -la packages/app/dist/installers/
          if ! ls packages/app/dist/installers/latest-linux*.yml >/dev/null 2>&1; then
            echo "::error::No latest-linux*.yml in dist/installers. electron-builder did not"
            echo "::error::emit Linux update metadata for this target — Linux auto-update would"
            echo "::error::ship broken. Check FpmTarget's isWriteUpdateInfo and the publish config."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # arch suffix prevents the two matrix entries from clobbering
          # each other's uploads. The release job's glob below
          # (`artifacts/linux-artifacts-*/*`) matches both.
          name: linux-artifacts-${{ matrix.arch }}
          path: |
            packages/app/dist/installers/*.deb
            packages/app/dist/installers/*.rpm
            packages/app/dist/installers/latest-linux*.yml
          if-no-files-found: error
          retention-days: 7

  # ── Release ───────────────────────────────────────────────────────────
  release:
    needs: [quality, release-preflight, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    # Downloads every platform's installers to draft the release; bounded
    # by artifact transfer, not compute.
    timeout-minutes: 30
    permissions:
      contents: write
      # Sigstore build-provenance attestations over the installers.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: List collected artifacts
        run: find artifacts -type f | sort

      # Every asset is hard-linked into one directory before the manifest is
      # written, so SHA256SUMS names files exactly as a user downloads them
      # and `sha256sum -c SHA256SUMS` works against a folder of downloads.
      # Hard links, not copies: the payload is ~7 GB and the runner disk is
      # not. `ln` without -f is deliberate — a name collision between two
      # platform artifacts should fail loudly here, not silently drop one.
      - name: Stage assets and generate SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release-assets
          declare -A seen=()
          while IFS= read -r asset; do
            name=$(basename "$asset")
            if [[ -n "${seen[$name]:-}" ]]; then
              echo "::error::release asset basename collision: $name"
              echo "::error::first: ${seen[$name]}"
              echo "::error::second: $asset"
              exit 1
            fi
            seen[$name]="$asset"
            ln "$asset" "release-assets/$name"
          done < <(find artifacts -mindepth 2 -type f -print | sort)
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS \
            | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      # SLSA build-provenance over every published asset — installers plus
      # SHA256SUMS, latest.yml, the blockmap and the SBOM. latest.yml in
      # particular is what electron-updater trusts to decide what to
      # download, so leaving it unattested undercut the installer coverage.
      # Users verify any asset with
      # `gh attestation verify <file> --repo bendyline/gezel`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*

      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ secrets.GEZEL_RELEASE_TOKEN || github.token }}
          RELEASE_TAG: v${{ needs.release-preflight.outputs.version }}
        run: |
          set -euo pipefail
          if existing="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$existing" != 'true' ]; then
              echo "::error::${RELEASE_TAG} is already published; refusing to modify it"
              exit 1
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          # GEZEL_RELEASE_TOKEN is optional — when unset, this falls back to
          # the default GITHUB_TOKEN (which only works if publishing to the
          # same repo the workflow runs in). To publish to a public mirror,
          # create a PAT with Contents: write on that repo, store it as
          # GEZEL_RELEASE_TOKEN, and set `repository:` accordingly.
          token: ${{ secrets.GEZEL_RELEASE_TOKEN || github.token }}
          tag_name: v${{ needs.release-preflight.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gezel Early Beta v${{ needs.release-preflight.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          # The staged directory, not the per-platform globs: it is the same
          # set of files (hard links) plus SHA256SUMS, and it is exactly what
          # was attested above, so published assets and attested subjects
          # cannot drift apart.
          files: release-assets/*

      # Publishing is a manual step in the GitHub UI, so no workflow can gate
      # what happens after it. Leave the operator the one command that proves
      # update discovery survived the publish — a native-v* release holding
      # /releases/latest makes the updater find nothing at all, and that is
      # invisible from the release page.
      - name: Record the post-publish update-discovery check
        run: |
          {
            echo '## After publishing this draft'
            echo
            echo 'Confirm the app namespace still owns `/releases/latest`:'
            echo
            echo '```'
            echo "node scripts/check-latest-release-namespace.mjs --expect ${{ needs.release-preflight.outputs.version }}"
            echo '```'
            echo
            echo 'If it fails, a `native-v*` release has taken the stable channel.'
            echo 'Re-flag it with `gh release edit <tag> --prerelease`.'
          } >> "$GITHUB_STEP_SUMMARY"
