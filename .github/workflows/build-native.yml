# Build (and, on tag pushes, draft) Gezel's native engine binaries.
#
# Triggers:
#   - Push of a tag named `native-vX.Y.Z` (the tagged commit is what the
#     build pipeline runs against — VERSION files inside native/engines/
#     pin each upstream). On tag pushes, the `draft_release` job below
#     aggregates the matrix outputs into a draft GitHub Release.
#   - Manual dispatch (handy for test runs after bumping a VERSION pin).
#     workflow_dispatch runs DO NOT create a draft — they upload
#     artifacts for inspection only.
#
# Native binaries are NOT built on every commit — that's deliberate.
# After a tagged build is validated, publish its draft manually from the
# GitHub Releases UI. Only then can `release-electron.yml` discover it
# as the latest native release and bundle those artifacts into the
# installer. Native cadence is decoupled from app cadence; bump
# `native-vX.Y.Z` every ~2 weeks (or whenever an engine's VERSION pin
# moves), let it bake, then publish it for the next Electron release.
#
# Matrix shape: one job per (engine, platform, variant). Each job:
#   1. Installs the platform/variant-specific build toolchain (Vulkan
#      SDK, CUDA Toolkit) when needed.
#   2. Runs the engine's build.sh / build.ps1 with LLAMA_BACKEND set
#      so multi-variant engines emit to <platform>-<variant>/ rather
#      than clobbering each other.
#   3. Uploads the produced binary as
#      `native-<engine>-<platform>[-<variant>]` for the draft-release
#      job below and for pre-publication validation.
#
# Produced binaries are code-signed in place when signing secrets are
# configured (Windows Authenticode via Azure Trusted Signing; macOS
# Developer ID) — done BEFORE the sha is computed so the release's
# SHA256SUMS and the runtime engine resolver's signature check both see
# the signed bytes. PRs/forks/manual test builds may remain unsigned, but
# a native-v* release tag fails closed unless signing and standalone macOS
# notarization credentials are present. The Electron installer additionally
# signs and notarizes the whole app at app-build time.
#
# History: prior to this consolidation release assembly was a separate
# `release-native.yml` workflow chained via `workflow_run`. That
# pattern silently broke when the workflow file changed on a feature
# branch (`workflow_run` reads the workflow definition from the
# default branch only) — we lost the 0.1.2 release that way. Putting
# draft assembly as a `needs: build` job in the same workflow eliminates
# that whole class of trigger failure. Publication is a separate,
# deliberately manual `workflow_dispatch` after the draft is validated.

name: Build native engines

permissions:
  contents: read

on:
  push:
    tags:
      - 'native-v*'
  workflow_dispatch:
    inputs:
      engines:
        description: 'Comma-separated engine list (default: all)'
        required: false
        default: 'all'

# Manual re-runs of the same tag cancel the prior in-flight run so we
# don't fight ourselves over scarce ubuntu/macos-13 runners. Tag
# pushes get unique groups so we never cancel a real release-bound
# run on a different tag.
concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_MIN: '3.24'
  # Current LunarG SDK on both platforms. The tarball/installer ships the
  # SPIRV-Headers CMake config required by ggml-vulkan, and LunarG keeps the
  # 1.4 SDK backward-compatible with older Vulkan targets.
  VULKAN_SDK_VERSION: '1.4.350.0'
  VULKAN_SDK_VERSION_WINDOWS: '1.4.350.0'
  # Highest glibc / libstdc++ symbol versions our own Linux binaries are
  # allowed to require. This is the distro floor, and it moves silently: the
  # build inherits whatever the runner image ships, so a runner bump narrows
  # the set of machines gezel runs on with no other signal. Declared here and
  # asserted per build so it can only change deliberately.
  #
  #   GLIBC 2.31 -> Ubuntu 20.04      GLIBCXX 3.4.28 -> GCC 9
  #   GLIBC 2.34 -> RHEL 9            GLIBCXX 3.4.29 -> GCC 11
  #   GLIBC 2.35 -> Ubuntu 22.04 LTS  GLIBCXX 3.4.30 -> GCC 12
  #   GLIBC 2.36 -> Debian 12         GLIBCXX 3.4.32 -> GCC 13
  #   GLIBC 2.38 -> Ubuntu 24.04, Fedora 39
  #
  # Current values are the status quo, not a target. At 2.38 we exclude
  # Ubuntu 22.04 LTS (supported to 2027), Debian 12 and RHEL 9 — and nothing
  # in the code needs it. The whole floor is toolchain leakage from building
  # on ubuntu-24.04: four `__isoc23_strtol`-family symbols from glibc 2.38's
  # C23 redirects, plus one `_ZSt21ios_base_library_initv` from GCC 13's
  # <iostream>. For comparison NVIDIA ships libcublas/libcudart against
  # GLIBC_2.17. Lowering this means building against older glibc headers —
  # a container or an older runner image — not changing any source.
  LINUX_MAX_GLIBC: '2.38'
  LINUX_MAX_GLIBCXX: '3.4.32'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gezel device-health helper (Windows + Linux). This is
          # first-party source, so it does not have an upstream VERSION pin.
          - engine: device-health
            kind: helper
            platform: win32-x64
            variant: ''
            runner: windows-latest
            script: build.ps1
            artifact: gezel-device-health.exe
            needs_cuda: false
            needs_vulkan: false
          - engine: device-health
            kind: helper
            platform: linux-x64
            variant: ''
            runner: ubuntu-latest
            script: build.sh
            artifact: gezel-device-health
            needs_cuda: false
            needs_vulkan: false
          - engine: device-health
            kind: helper
            platform: linux-arm64
            variant: ''
            runner: ubuntu-24.04-arm
            script: build.sh
            artifact: gezel-device-health
            needs_cuda: false
            needs_vulkan: false

          # Gezel service host (Windows-only): first-party SCM host for
          # gezeld, the ImagePath of GezelService. Replaces the vendored
          # NSSM wrapper. macOS/Linux use launchd/systemd — no helper.
          - engine: service-host
            kind: helper
            platform: win32-x64
            variant: ''
            runner: windows-latest
            script: build.ps1
            artifact: gezel-service-host.exe
            needs_cuda: false
            needs_vulkan: false

          # ── sd-cpp (single variant per platform) ──────────────
          - engine: sd-cpp
            platform: darwin-arm64
            variant: ''
            runner: macos-latest
            script: build.sh
            artifact: gezel-sd-server
            sd_backend: metal
            needs_cuda: false
            needs_vulkan: false
          # darwin-x64 (Intel Mac) intentionally omitted — Apple's own
          # support horizon is narrowing, the macos-13 runner pool is
          # scarce + slow in CI, and on-device first-run routes Intel
          # Mac users to Copilot/OpenAI by default (see
          # `bootstrapOnDeviceFirstRun`). Users who still want a local
          # engine on Intel Mac can build from source and drop the
          # binary into `~/.gezel/engines/<engine>/darwin-x64/`.
          - engine: sd-cpp
            platform: linux-x64
            variant: ''
            runner: ubuntu-latest
            script: build.sh
            artifact: gezel-sd-server
            # Vulkan-linked: `libvulkan.so.1` must be present on the user's
            # machine or the process dies at exec, before sd.cpp can fall
            # back to CPU. See native/engines/sd-cpp/README.md.
            sd_backend: vulkan
            needs_cuda: false
            needs_vulkan: true
          # linux-arm64: LunarG's Vulkan SDK has no aarch64 tarball, so
          # this build falls through to CPU inside build.sh. Vulkan is
          # deliberately deferred until upstream Vulkan SDK ships an
          # arm64 tarball (or we add a shaderc-from-source step).
          - engine: sd-cpp
            platform: linux-arm64
            variant: ''
            runner: ubuntu-24.04-arm
            script: build.sh
            artifact: gezel-sd-server
            sd_backend: cpu
            needs_cuda: false
            needs_vulkan: false
          - engine: sd-cpp
            platform: win32-x64
            variant: ''
            runner: windows-latest
            script: build.ps1
            artifact: gezel-sd-server.exe
            # Vulkan-linked, same as linux-x64. Lower risk here: every GPU
            # driver installs vulkan-1.dll into System32.
            sd_backend: vulkan
            needs_cuda: false
            needs_vulkan: true

          # ── llama-cpp (multi-variant on Linux+Windows, single
          #    on macOS — Phase 0 spike validated all 7 combos)
          - engine: llama-cpp
            platform: darwin-arm64
            variant: metal
            runner: macos-latest
            script: build.sh
            artifact: gezel-llama-server
            needs_cuda: false
            needs_vulkan: false
          - engine: llama-cpp
            platform: linux-x64
            variant: cpu
            runner: ubuntu-latest
            script: build.sh
            artifact: gezel-llama-server
            needs_cuda: false
            needs_vulkan: false
          - engine: llama-cpp
            platform: linux-x64
            variant: vulkan
            runner: ubuntu-latest
            script: build.sh
            artifact: gezel-llama-server
            needs_cuda: false
            needs_vulkan: true
          - engine: llama-cpp
            platform: linux-x64
            variant: cuda
            runner: ubuntu-latest
            script: build.sh
            artifact: gezel-llama-server
            needs_cuda: true
            needs_vulkan: false
            # Modern consumer x86 NVIDIA: sm_75 (RTX 20 / GTX 16 / T4, Turing),
            # sm_86 (RTX 30 / Ampere), sm_89 (RTX 40 / Ada), sm_120 (RTX 50 /
            # Blackwell). Each plain entry compiles native SASS + PTX, so a
            # newer-than-listed card still runs via JIT. sm_121 (GB10) is
            # ARM-only + needs CUDA 12.9, so it lives on the arm64 leg (below),
            # not here. This x64 leg stays on the workflow-default CUDA 12.8
            # (supports sm_75 through sm_120).
            llama_cuda_arch: '75;86;89;120'
          # linux-arm64 (Jetson, DGX Spark / Grace Hopper, Ampere
          # Altra). CPU + CUDA only — Vulkan deferred (LunarG SDK has
          # no aarch64 tarball; revisit when upstream ships one or
          # when we add a shaderc-from-source step).
          - engine: llama-cpp
            platform: linux-arm64
            variant: cpu
            runner: ubuntu-24.04-arm
            script: build.sh
            artifact: gezel-llama-server
            needs_cuda: false
            needs_vulkan: false
          - engine: llama-cpp
            platform: linux-arm64
            variant: cuda
            runner: ubuntu-24.04-arm
            script: build.sh
            artifact: gezel-llama-server
            needs_cuda: true
            needs_vulkan: false
            # GB10 / DGX Spark is sm_121. llama.cpp adds 121a-real only
            # with CUDA 12.9+, so the ARM64 CUDA server needs the newer
            # toolkit even though other llama-cpp CUDA legs can use 12.8.
            # NOTE: this leg deliberately sets NO `llama_cuda_arch` — it relies
            # on llama.cpp's own CMake default, which at 12.9 emits the exact
            # `121a-real` form (the arch-specific `a` suffix Blackwell needs).
            # Hand-writing "121" here risks the wrong form; the default is the
            # proven path. Add an explicit list only if you also need to cover
            # other arm64 CUDA GPUs (e.g. GH200 sm_90).
            cuda_pkg: '12-9'
          - engine: llama-cpp
            platform: win32-x64
            variant: cpu
            runner: windows-latest
            script: build.ps1
            artifact: gezel-llama-server.exe
            needs_cuda: false
            needs_vulkan: false
          - engine: llama-cpp
            platform: win32-x64
            variant: vulkan
            runner: windows-latest
            script: build.ps1
            artifact: gezel-llama-server.exe
            needs_cuda: false
            needs_vulkan: true
          # win32 CUDA pins windows-2022 (VS 2022 / MSVC 14.4x), NOT
          # windows-latest. windows-latest moved to Visual Studio 2026
          # (MSVC 14.51 / _MSC_VER 1951), whose toolchain crashes CUDA
          # 12.4's front-end (`nvcc error: 'cudafe++' died with status
          # 0xC0000005`, even with -allow-unsupported-compiler). VS 2022 is
          # the CUDA-12.4-compatible host — the same toolchain class that
          # built this leg green through native-v0.1.11. cpu/vulkan/cpu-only
          # win32 legs don't touch nvcc and stay on windows-latest.
          - engine: llama-cpp
            platform: win32-x64
            variant: cuda
            runner: windows-2022
            script: build.ps1
            artifact: gezel-llama-server.exe
            needs_cuda: true
            needs_vulkan: false

          # ── ds4 (DwarfStar / DeepSeek-V4) — Metal on darwin-arm64,
          #    CUDA on Linux. GPU-only (no CPU / Vulkan / ROCm / Windows /
          #    Intel-Mac). Single shippable backend per platform, so
          #    variant:'' (emits to native/build/<platform>/, like sd-cpp).
          - engine: ds4
            platform: darwin-arm64
            variant: ''
            runner: macos-latest
            script: build.sh
            artifact: gezel-ds4-server
            needs_cuda: false
            needs_vulkan: false
          # Linux CUDA: ds4's Makefile takes a SINGLE -arch (CUDA_ARCH), so a
          # prebuilt binary targets one GPU generation. linux-x64 defaults to
          # sm_90 (Hopper/datacenter); consumer (Ada sm_89, Blackwell
          # sm_100/120) users should rebuild from source. The DGX Spark / GB10
          # leg uses the 'spark' sentinel (empty -arch, matching antirez's
          # `make cuda-spark`). darwin-x64 + win32-x64 are intentionally
          # omitted — build.sh / build.ps1 no-op there.
          # variant: cuda — on Linux ds4 emits into the `-cuda` key so it
          # shares llama-server's NVIDIA redistributables instead of shipping
          # a second byte-identical copy. See scripts/native-payload.mjs.
          - engine: ds4
            platform: linux-x64
            variant: cuda
            runner: ubuntu-latest
            script: build.sh
            artifact: gezel-ds4-server
            needs_cuda: true
            needs_vulkan: false
            ds4_cuda_arch: 'sm_90'
          - engine: ds4
            platform: linux-arm64
            variant: cuda
            runner: ubuntu-24.04-arm
            script: build.sh
            artifact: gezel-ds4-server
            needs_cuda: true
            needs_vulkan: false
            # DGX Spark's GB10 is compute capability sm_121. The old 'spark'
            # sentinel built with an empty -arch (matching antirez's
            # `make cuda-spark`, which relies on nvcc auto-detecting the local
            # GPU) — but a GPU-less CI cross-build then defaults to sm_52,
            # which lacks the __dp4a intrinsic ds4_cuda.cu uses. Build for
            # sm_121 explicitly. sm_121 first shipped in CUDA 12.9, so this
            # leg overrides the toolkit to 12.9 (others stay 12.8).
            ds4_cuda_arch: 'sm_121'
            cuda_pkg: '12-9'

          # ── whisper-cpp (single CPU variant per platform for the
          #    narration MVP — Metal is implicit on darwin-arm64 via
          #    the OS SDK; CUDA / Vulkan variants are deferred until
          #    audio-chat work demands the latency improvement).
          - engine: whisper-cpp
            platform: darwin-arm64
            variant: ''
            runner: macos-latest
            script: build.sh
            artifact: gezel-whisper-server
            needs_cuda: false
            needs_vulkan: false
          - engine: whisper-cpp
            platform: linux-x64
            variant: ''
            runner: ubuntu-latest
            script: build.sh
            artifact: gezel-whisper-server
            needs_cuda: false
            needs_vulkan: false
          - engine: whisper-cpp
            platform: linux-arm64
            variant: ''
            runner: ubuntu-24.04-arm
            script: build.sh
            artifact: gezel-whisper-server
            needs_cuda: false
            needs_vulkan: false
          - engine: whisper-cpp
            platform: win32-x64
            variant: ''
            runner: windows-latest
            script: build.ps1
            artifact: gezel-whisper-server.exe
            needs_cuda: false
            needs_vulkan: false

          # ── uv (precompiled download, no GPU variants) ───────
          # Shared Python bootstrap for features that need a venv
          # (MLX today; Whisper / Python-based MCP servers later).
          # The build script is a download-and-verify, not a compile,
          # so no toolchain steps fire for these jobs.
          - engine: uv
            platform: darwin-arm64
            variant: ''
            runner: macos-latest
            script: build.sh
            artifact: uv
            needs_cuda: false
            needs_vulkan: false
          # darwin-x64 omitted — see the sd-cpp note above. uv is
          # download-only so rebuilding for Intel Mac is cheap if we
          # ever want to re-enable; removing the matrix row is
          # sufficient for now.
          - engine: uv
            platform: linux-x64
            variant: ''
            runner: ubuntu-latest
            script: build.sh
            artifact: uv
            needs_cuda: false
            needs_vulkan: false
          - engine: uv
            platform: linux-arm64
            variant: ''
            runner: ubuntu-24.04-arm
            script: build.sh
            artifact: uv
            needs_cuda: false
            needs_vulkan: false
          - engine: uv
            platform: win32-x64
            variant: ''
            runner: windows-latest
            script: build.ps1
            artifact: uv.exe
            needs_cuda: false
            needs_vulkan: false
    runs-on: ${{ matrix.runner }}
    # The llama-cpp darwin-arm64 metal leg has legitimately run 98 min green,
    # and the linux-x64 cuda leg 67. Sized at roughly 2x the worst observed so
    # a slow-but-working compile is never the thing that trips this.
    timeout-minutes: 180
    env:
      # Multi-variant engines (currently only llama-cpp) read these
      # to pick the cmake backend flag and emit to a per-variant
      # output directory. Single-variant engines (sd-cpp) ignore
      # them — variant is empty in the matrix entries above.
      LLAMA_BACKEND: ${{ matrix.variant }}
      LLAMA_BACKEND_TAG: ${{ matrix.variant != '' && '1' || '' }}
      # sd-cpp ships one binary per platform, so its backend is a property
      # of the matrix row rather than of `variant`. Declare it explicitly:
      # build.sh's `auto` path resolves the backend from `command -v
      # vulkaninfo`, which silently couples the SHIPPED backend to whether
      # the Vulkan SDK install step ran on that runner. native-v0.1.18
      # shipped a Vulkan-linked linux-x64 sd-server that way while the
      # script's own comment claimed the default stayed CPU. Empty on
      # non-sd rows, which build.sh/.ps1 treat as their own default.
      SD_BACKEND: ${{ matrix.sd_backend || '' }}
      # ds4 linux CUDA build reads this for the nvcc -arch (its Makefile takes
      # a single CUDA_ARCH; 'spark' = empty -arch for GB10). Empty for every
      # non-ds4-linux job (ignored there).
      DS4_CUDA_ARCH: ${{ matrix.ds4_cuda_arch || '' }}
      # llama-cpp CUDA build reads this for -DCMAKE_CUDA_ARCHITECTURES. Set on
      # the linux-x64-cuda leg to the modern-consumer set (RTX 30/40/50).
      # Empty everywhere else → build.sh omits the flag and llama.cpp's own
      # CMake picks its portable default (which at CUDA 12.9+ includes
      # 121a-real for the arm64 DGX-Spark leg). Empty is CI-safe; `native`
      # is NOT (GPU-less runners can't resolve it).
      LLAMA_CUDA_ARCH: ${{ matrix.llama_cuda_arch || '' }}
      # workflow_dispatch can target a comma-separated engine subset. Push
      # builds always resolve this to `all`.
      REQUESTED_ENGINES: ${{ inputs.engines || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Preflight: filter manual runs + skip unpinned engines ─
      # Engine VERSION files that still carry the all-zeros bring-up
      # placeholder (commit=00…00) can't be fetched — upstream
      # rightly rejects "not our ref 0000…". When that happens for
      # an engine we don't intend to ship in this release tag, fail
      # every job in the matrix would block the llama-cpp binaries
      # we DO intend to ship. Soft-skip instead: read the VERSION
      # file here and set `pinned`; every subsequent step gates on
      # that output. A ::notice:: annotation surfaces the skip in
      # the run summary so nobody wonders where the sd-cpp binaries
      # went.
      - name: Preflight — check engine is pinned
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          requested=$(printf '%s' "$REQUESTED_ENGINES" | tr -d '[:space:]')
          requested="${requested:-all}"
          requested_list=",$requested,"
          if [[ "$requested_list" != *",all,"* && "$requested_list" != *",${{ matrix.engine }},"* ]]; then
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.engine }} not selected::Manual run requested '$REQUESTED_ENGINES' — skipping this job."
            exit 0
          fi
          if [[ "${{ matrix.kind }}" == "helper" ]]; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
            echo "[preflight] ${{ matrix.engine }} is first-party helper source"
            exit 0
          fi
          version_file="native/engines/${{ matrix.engine }}/VERSION"
          commit=$(grep -E '^commit=' "$version_file" | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          if [[ "$commit" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$commit" =~ ^0+$ ]]; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
            echo "[preflight] ${{ matrix.engine }} pinned at $commit"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.engine }} unpinned::VERSION file still has placeholder commit=$commit — skipping this job. Pin a real SHA in $version_file to build."
          fi

      # ── Vulkan SDK (Linux) ────────────────────────────────────
      # Ubuntu's libvulkan-dev ships without glslc (the shader
      # compiler llama.cpp requires at CMake configure time), so
      # we use the LunarG SDK tarball — same upstream as the
      # Windows path.
      - name: Install Vulkan SDK (Linux)
        if: steps.preflight.outputs.pinned == 'true' && matrix.needs_vulkan && matrix.platform == 'linux-x64'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libvulkan-dev pkg-config wget xz-utils
          VK_VER='${{ env.VULKAN_SDK_VERSION }}'
          wget -q -O /tmp/vulkan-sdk.tar.xz \
            "https://sdk.lunarg.com/sdk/download/${VK_VER}/linux/vulkansdk-linux-x86_64-${VK_VER}.tar.xz"
          mkdir -p "$HOME/vulkan-sdk"
          tar -xJf /tmp/vulkan-sdk.tar.xz -C "$HOME/vulkan-sdk"
          SDK_ROOT="$HOME/vulkan-sdk/${VK_VER}/x86_64"
          test -x "$SDK_ROOT/bin/glslc"
          echo "VULKAN_SDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$SDK_ROOT/lib" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$SDK_ROOT" >> "$GITHUB_ENV"

      # ── Vulkan SDK (Windows) ──────────────────────────────────
      - name: Install Vulkan SDK (Windows)
        if: steps.preflight.outputs.pinned == 'true' && matrix.needs_vulkan && matrix.platform == 'win32-x64'
        shell: pwsh
        run: |
          $version = '${{ env.VULKAN_SDK_VERSION_WINDOWS }}'
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          $sdk = "C:\VulkanSDK\$version"
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH

      # ── CUDA Toolkit (Linux) ──────────────────────────────────
      # Direct apt-install from NVIDIA's ubuntu2404 repo. Phase 0
      # validated this — Jimver action's sub-package naming doesn't
      # match NVIDIA's real package names, so doing it ourselves is
      # both deterministic and one fewer external dep.
      #
      # x86_64 lives under the `x86_64/` repo path; arm64 (Jetson,
      # DGX Spark, Grace Hopper, Ampere Altra) lives under `sbsa/`
      # (Server Base System Architecture). The package names and
      # install layout are otherwise identical.
      - name: Install CUDA Toolkit (Linux)
        if: steps.preflight.outputs.pinned == 'true' && matrix.needs_cuda && startsWith(matrix.platform, 'linux-')
        run: |
          set -euxo pipefail
          # CUDA toolkit version is per-leg. Default 12.8; the ds4 DGX-Spark
          # (linux-arm64) leg sets matrix.cuda_pkg=12-9 because sm_121 (GB10)
          # support first shipped in CUDA 12.9 (12.8 stops at sm_120). `12-9`
          # is the apt package suffix; `12.9` is the install-path form.
          cuda_pkg="${{ matrix.cuda_pkg }}"
          cuda_pkg="${cuda_pkg:-12-8}"
          cuda_ver="${cuda_pkg//-/.}"
          case "${{ matrix.platform }}" in
            linux-x64)   cuda_arch="x86_64" ;;
            linux-arm64) cuda_arch="sbsa" ;;
            *) echo "unsupported linux platform for CUDA: ${{ matrix.platform }}"; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build wget gpg ca-certificates
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/${cuda_arch}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "cuda-nvcc-${cuda_pkg}" "cuda-cudart-dev-${cuda_pkg}" "libcublas-dev-${cuda_pkg}"
          echo "CUDA_PATH=/usr/local/cuda-${cuda_ver}" >> "$GITHUB_ENV"
          # ds4's Makefile invokes `$(CUDA_HOME)/bin/nvcc` directly (not PATH
          # nvcc), and there's no guaranteed /usr/local/cuda symlink, so pin
          # CUDA_HOME explicitly. Harmless for llama-cpp (it finds CUDA via CMake).
          echo "CUDA_HOME=/usr/local/cuda-${cuda_ver}" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-${cuda_ver}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${cuda_ver}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          "/usr/local/cuda-${cuda_ver}/bin/nvcc" --version

      # ── CUDA Toolkit (Windows) ────────────────────────────────
      # Jimver's action handles the Windows installer download +
      # PATH wiring cleanly. Network method is faster than the
      # full local installer download.
      - name: Install CUDA Toolkit (Windows)
        if: steps.preflight.outputs.pinned == 'true' && matrix.needs_cuda && matrix.platform == 'win32-x64'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","visual_studio_integration"]'

      # ── Linux CPU baseline build deps ─────────────────────────
      # Fires for every linux-* CPU-only build (x86_64 and arm64
      # alike). The CUDA / Vulkan steps install their own toolchains
      # and don't need this. arm64-on-arm64 cross-compile isn't a
      # concern — we run natively on ubuntu-24.04-arm.
      - name: Install base build deps (Linux CPU)
        if: steps.preflight.outputs.pinned == 'true' && startsWith(matrix.platform, 'linux-') && !matrix.needs_cuda && !matrix.needs_vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      # macOS ships Metal + Xcode CLI tools; no extra steps needed.

      # ── Build ─────────────────────────────────────────────────
      - name: Build ${{ matrix.engine }} for ${{ matrix.platform }}${{ matrix.variant && format('-{0}', matrix.variant) }}
        if: steps.preflight.outputs.pinned == 'true'
        shell: bash
        run: |
          if [[ "${{ matrix.kind }}" == "helper" ]]; then
            script="native/helpers/${{ matrix.engine }}/${{ matrix.script }}"
          else
            script="native/engines/${{ matrix.engine }}/${{ matrix.script }}"
          fi
          if [[ "${{ matrix.script }}" == "build.ps1" ]]; then
            pwsh -File "$script"
          else
            bash "$script"
          fi

      # ── Resolve output dir for the rest of the steps ──────────
      - name: Resolve output dir
        if: steps.preflight.outputs.pinned == 'true'
        id: outdir
        shell: bash
        run: |
          if [[ -n "${{ matrix.variant }}" ]]; then
            echo "dir=native/build/${{ matrix.platform }}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ matrix.platform }}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=native/build/${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Post-build sanity ─────────────────────────────────────
      - name: Stage native redistribution licenses
        if: steps.preflight.outputs.pinned == 'true'
        shell: bash
        env:
          REQUIRE_CUDA_EULA: ${{ matrix.needs_cuda }}
        run: |
          set -euo pipefail
          output="${{ steps.outdir.outputs.dir }}"
          if [[ "$REQUIRE_CUDA_EULA" == "true" ]]; then
            node scripts/stage-native-artifact-licenses.mjs \
              --output "$output" --cuda
          else
            node scripts/stage-native-artifact-licenses.mjs \
              --output "$output"
          fi

      - name: Smoke test
        if: steps.preflight.outputs.pinned == 'true'
        shell: bash
        run: |
          out="${{ steps.outdir.outputs.dir }}"
          bin="$out/${{ matrix.artifact }}"
          test -f "$bin" || { echo "missing $bin"; exit 1; }
          if [[ "${{ matrix.platform }}" == darwin-* ]]; then
            file "$bin"
          fi
          # CUDA builds dynamically link against libcuda.so.1 (Linux) /
          # nvcuda.dll (Windows). Those come from the NVIDIA *driver*
          # (not the CUDA Toolkit) and are NOT redistributable — they
          # have to be on the user's machine via the installed GPU
          # driver. Our CI runners don't have GPUs, so the runtime
          # smoke check would always fail with a false positive
          # (libcuda.so.1: not found / 0xC0000135). For CUDA variants
          # we do a loader check and ignore only the driver lib.
          if [[ "${{ matrix.variant }}" == cuda || ( "${{ matrix.engine }}" == ds4 && "${{ matrix.platform }}" == linux-* ) ]]; then
            echo "[smoke] CUDA variant — skipping runtime --help (no GPU driver on CI)."
            ls -la "$bin"
            if [[ "${{ matrix.platform }}" == linux-* ]]; then
              echo "[smoke] ldd $bin:"
              ldd_out="$(env -u LD_LIBRARY_PATH ldd "$bin" 2>&1 || true)"
              printf '%s\n' "$ldd_out"
              missing=()
              while read -r lib; do
                [[ -n "$lib" ]] || continue
                # Driver-provided lib — not in the bundle by design.
                if [[ "$lib" == "libcuda.so.1" ]]; then continue; fi
                # ds4 shares the `-cuda` key with llama-server's CUDA leg,
                # which is the single writer of the NVIDIA redistributables
                # (see native/engines/ds4/build.sh 5b). They are absent from
                # THIS leg's output and appear when the draft-release job
                # merges the two artifacts, so they cannot resolve here. The
                # merged tree is checked instead by "Verify CUDA payload".
                if [[ "${{ matrix.engine }}" == ds4 ]]; then
                  case "$lib" in libcudart.so.*|libcublas.so.*|libcublasLt.so.*) continue ;; esac
                fi
                missing+=("$lib")
              done < <(grep 'not found' <<<"$ldd_out" | awk '{print $1}')
              if [[ ${#missing[@]} -gt 0 ]]; then
                echo "::error::$bin has unresolved non-driver dependencies: ${missing[*]}"
                exit 1
              fi
              echo "[smoke] all non-driver runtime dependencies resolvable"
            fi
          else
            # `--help` may exit non-zero on a runner that lacks the
            # actual GPU — we only care that the binary loads its
            # dependencies cleanly. We tolerate non-zero exit, but we
            # DO require the binary to produce some output: a silent
            # exit with no stdout/stderr is what STATUS_DLL_NOT_FOUND
            # (0xC0000135) looks like to the parent shell, and that's
            # the regression class we want to catch in CI rather than
            # ship to users (e.g. the libssl/libcrypto bug in 0.1.5).
            #
            # Keep this probe out of Bash string processing. llama-server's
            # help is ~52 KiB, and macOS's Bash 3.2 can spend hours applying
            # a global character-class replacement to it. The Node helper
            # enforces a 60-second timeout, caps output, prints 20 lines, and
            # accepts non-zero exits only when the process produced output.
            if ! node scripts/smoke-native-help.mjs "$bin"; then
              echo "::error::$bin produced no --help output — likely a startup DLL load failure (0xC0000135 / dlopen). The bundle is missing a runtime dependency."
              exit 1
            fi
            # Linux: verify the bundle is self-contained. ldd resolves
            # via the binary's RPATH ($ORIGIN, set by patchelf), so it
            # shows OUR bundled libssl.so.3 etc. rather than the system
            # copies IF the rpath fixup worked. "not found" means the
            # bundle would fail on a user machine without the dep —
            # fail the build, don't ship it.
            if [[ "${{ matrix.platform }}" == linux-* ]]; then
              echo "[smoke] ldd $bin:"
              ldd "$bin" || true
              if ldd "$bin" 2>&1 | grep -q "not found"; then
                echo "::error::$bin has unresolved dependencies — bundle is not self-contained"
                ldd "$bin" 2>&1 | grep "not found"
                exit 1
              fi
            fi
          fi
          # Always log the full bundle contents — diagnostic, especially
          # when the peer-lib check below fails on an upstream version
          # whose naming has shifted.
          echo "[smoke] bundle contents:"
          ls -la "$out"

          # llama-cpp's per-backend code (ggml-cuda / ggml-vulkan /
          # ggml-metal / ggml-cpu) ships as a separate shared lib that
          # the binary dlopens at model-load time. The `--help` check
          # above doesn't catch a missing one — we'd ship a bundle
          # that says it's ready and dies with STATUS_DLL_NOT_FOUND
          # (Windows) / dlopen error (Mac/Linux) on the first chat.
          # That's the regression that broke 0.1.2 / 0.1.3.
          #
          # We only check the per-backend peer, NOT generic ggml /
          # ggml-base / llama, because those names have shifted across
          # upstream versions (the modularization landed mid-2024,
          # earlier pins didn't have a separate ggml-base, etc.). The
          # backend-specific peer has been stable across the relevant
          # range.
          #
          # CMake naming conventions:
          #   Windows: ggml-cuda.dll          (no `lib` prefix)
          #   Linux:   libggml-cuda.so
          #   macOS:   libggml-metal.dylib
          if [[ "${{ matrix.engine }}" == llama-cpp ]]; then
            case "${{ matrix.platform }}" in
              win32-*)  lib_prefix=""    ; lib_ext=dll   ;;
              darwin-*) lib_prefix="lib" ; lib_ext=dylib ;;
              linux-*)  lib_prefix="lib" ; lib_ext=so    ;;
            esac
            case "${{ matrix.variant }}" in
              cuda)   peer="${lib_prefix}ggml-cuda.${lib_ext}"   ;;
              vulkan) peer="${lib_prefix}ggml-vulkan.${lib_ext}" ;;
              metal)  peer="${lib_prefix}ggml-metal.${lib_ext}"  ;;
              cpu)    peer="${lib_prefix}ggml-cpu.${lib_ext}"    ;;
            esac
            # Also accept versioned suffixes (e.g. libggml-cuda.so.1).
            if ! ls "$out"/${peer}* >/dev/null 2>&1; then
              echo "::error::missing backend peer lib ${peer} alongside ${{ matrix.artifact }} — build script likely failed to glob it from the cmake output"
              exit 1
            fi
            echo "[smoke] backend peer lib ${peer} present ✓"
          fi
          # CUDA bundles must have cudart/cublas beside the executable so the
          # binary works on machines without the matching toolkit. Only the
          # llama-cpp CUDA leg stages them — it is the single writer for the
          # `-cuda` keys that ds4 now shares (see native-payload.mjs), so
          # asserting it on ds4's leg would check a directory that is
          # deliberately incomplete until the draft-release merge.
          if [[ "${{ matrix.variant }}" == cuda && "${{ matrix.engine }}" == llama-cpp ]]; then
            ls "$out" | grep -Ei 'cudart|cublas' || { echo "CUDA runtime libraries missing alongside exe"; exit 1; }
          fi

      # ── Unbundled-runtime guard ───────────────────────────────────
      # The engines are built with -DGGML_OPENMP=OFF so nothing depends
      # on libgomp.so.1 / VCOMP140.DLL, neither of which we ship. Assert
      # it, because the `ldd`/`--help` checks above structurally cannot:
      # every runner has a toolchain installed, so the dependency always
      # resolves in CI and only fails on a user's machine. Checks the
      # peer libs too — the OpenMP link lands in libggml-base and
      # libggml-cpu, not in the server binary.
      - name: Assert no unbundled runtime dependencies
        if: steps.preflight.outputs.pinned == 'true'
        shell: bash
        run: |
          set -uo pipefail
          out="${{ steps.outdir.outputs.dir }}"
          bad=0
          if [[ "${{ matrix.platform }}" == win32-* ]]; then
            # dumpbin ships with the MSVC toolchain already on the runner.
            dumpbin="$(find '/c/Program Files/Microsoft Visual Studio' -name dumpbin.exe -path '*x64*' 2>/dev/null | head -1)"
            if [[ -z "$dumpbin" ]]; then
              echo "::warning::dumpbin not found — skipping VCOMP140 import check"
              exit 0
            fi
            for f in "$out"/*.exe "$out"/*.dll; do
              [[ -e "$f" ]] || continue
              deps="$("$dumpbin" //dependents "$f" 2>/dev/null || true)"
              if grep -qi 'VCOMP[0-9]*\.DLL' <<<"$deps"; then
                echo "::error::$(basename "$f") imports the MSVC OpenMP runtime (VCOMP*.DLL), which is not bundled"
                bad=1
              fi
              if grep -qiE 'libssl-|libcrypto-' <<<"$deps"; then
                echo "::error::$(basename "$f") imports OpenSSL. Engines are built with -DLLAMA_OPENSSL=OFF; do not reinstate the Git-for-Windows DLL scavenge."
                bad=1
              fi
            done
          else
            for f in "$out"/*; do
              [[ -f "$f" && ! -L "$f" ]] || continue
              # objdump on Linux, otool on macOS; skip non-Mach-O/ELF quietly.
              if [[ "${{ matrix.platform }}" == darwin-* ]]; then
                deps="$(otool -L "$f" 2>/dev/null || true)"
              else
                deps="$(objdump -p "$f" 2>/dev/null | awk '/NEEDED/ {print $2}' || true)"
              fi
              if grep -qE 'libgomp|libomp' <<<"$deps"; then
                echo "::error::$(basename "$f") links an OpenMP runtime (libgomp/libomp), which is not bundled"
                bad=1
              fi
              # -DLLAMA_OPENSSL=OFF means nothing should link OpenSSL. If it
              # comes back we would be redistributing a TLS library scavenged
              # from the build host again — catch it here, not at audit time.
              if grep -qE 'libssl|libcrypto' <<<"$deps"; then
                echo "::error::$(basename "$f") links OpenSSL. Engines are built with -DLLAMA_OPENSSL=OFF; do not reinstate build-host OpenSSL bundling."
                bad=1
              fi
            done
          fi
          if (( bad )); then
            echo "::error::Rebuild with -DGGML_OPENMP=OFF, or bundle the runtime and add it to NOTICE.md."
            exit 1
          fi
          echo "[guard] no unbundled OpenMP runtime dependency"

      # ── Linux symbol-version floor ────────────────────────────────
      # Assert our binaries don't require newer glibc / libstdc++ symbols than
      # LINUX_MAX_GLIBC / LINUX_MAX_GLIBCXX declare. Vendor libraries are
      # excluded: their floor is the vendor's choice and is already lower than
      # ours (NVIDIA targets GLIBC_2.17). Nothing else in CI notices this —
      # the runner always satisfies whatever it just built.
      - name: Assert Linux symbol-version floor
        if: steps.preflight.outputs.pinned == 'true' && startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -uo pipefail
          out="${{ steps.outdir.outputs.dir }}"
          bad=0
          highest() { # highest() <file> <prefix> -> max version, or empty
            objdump -T "$1" 2>/dev/null \
              | grep -oE "$2[0-9.]+" | sed "s/^$2//" | sort -uV | tail -1
          }
          gt() { # gt() <a> <b> -> true when a > b
            [[ "$1" != "$2" && "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" == "$1" ]]
          }
          for f in "$out"/*; do
            [[ -f "$f" && ! -L "$f" ]] || continue
            case "$(basename "$f")" in
              libcu*|libnv*|libvulkan*|uv) continue ;;
            esac
            file -b "$f" 2>/dev/null | grep -q ELF || continue
            g=$(highest "$f" 'GLIBC_')
            x=$(highest "$f" 'GLIBCXX_')
            if [[ -n "$g" ]] && gt "$g" "${LINUX_MAX_GLIBC}"; then
              echo "::error::$(basename "$f") requires GLIBC_$g, above the declared floor ${LINUX_MAX_GLIBC}"
              objdump -T "$f" | grep "GLIBC_$g" | awk '{print "          " $NF}' | sort -u | head -20
              bad=1
            fi
            if [[ -n "$x" ]] && gt "$x" "${LINUX_MAX_GLIBCXX}"; then
              echo "::error::$(basename "$f") requires GLIBCXX_$x, above the declared floor ${LINUX_MAX_GLIBCXX}"
              objdump -T "$f" | grep "GLIBCXX_$x" | awk '{print "          " $NF}' | sort -u | head -20
              bad=1
            fi
            printf '[floor] %-38s GLIBC_%-8s GLIBCXX_%s\n' "$(basename "$f")" "${g:--}" "${x:--}"
          done
          if (( bad )); then
            echo "::error::Raising the floor narrows which distros can run gezel. Either build against older glibc headers, or raise LINUX_MAX_GLIBC/LINUX_MAX_GLIBCXX deliberately and update docs/native-runtime-requirements.md."
            exit 1
          fi
          echo "[floor] within declared limits (GLIBC ${LINUX_MAX_GLIBC}, GLIBCXX ${LINUX_MAX_GLIBCXX})"

      # ── macOS rpath hygiene ───────────────────────────────────────
      # The darwin build scripts delete the absolute LC_RPATH CMake bakes
      # in (the .upstream build dir — a /Users/runner/… CI path, i.e. a
      # build-host fingerprint visible to anyone running `otool -l`;
      # native-v0.1.19 shipped with it). That fixup is `|| true`-lenient,
      # so assert here that no absolute entry survived — same pattern as
      # the OpenMP and glibc-floor guards: CI is the only place this can
      # fail loudly before it ships.
      - name: Assert no absolute rpaths (macOS)
        if: steps.preflight.outputs.pinned == 'true' && startsWith(matrix.platform, 'darwin')
        shell: bash
        run: |
          set -uo pipefail
          out="${{ steps.outdir.outputs.dir }}"
          bad=0
          for f in "$out"/*; do
            [[ -f "$f" && ! -L "$f" ]] || continue
            file -b "$f" 2>/dev/null | grep -q Mach-O || continue
            while read -r rp; do
              if [[ "$rp" == /* ]]; then
                echo "::error::$(basename "$f") carries absolute LC_RPATH $rp — build-host path leaked into a shipping binary"
                bad=1
              fi
            done < <(otool -l "$f" | awk '/cmd LC_RPATH/{p=1} p && $1 == "path" {print $2; p=0}')
          done
          if (( bad )); then
            echo "::error::Strip absolute rpaths in the engine build script (rewrite_macho's -delete_rpath pass) rather than exempting them here."
            exit 1
          fi
          echo "[rpath] no absolute LC_RPATH entries in $out"

      # ── Code-sign the engine binaries (gated on secrets) ──────
      # Sign HERE — after the smoke test, before the sha is computed and
      # the artifact uploaded — so the release's SHA256SUMS reflects the
      # SIGNED bytes and the runtime engine resolver's signature check
      # (engineSignaturePolicy) passes.
      #
      # Policy: we sign what we compile. A signature asserts authorship and
      # integrity, so putting Bendyline's name on NVIDIA's cuBLAS or Astral's
      # uv would claim something we are not in a position to claim, and would
      # rewrite bytes those vendors published under their own redistribution
      # terms. Vendor binaries therefore ship byte-identical to their
      # upstream release, hash-comparable against the vendor's own manifest.
      # The authoritative list lives in
      # packages/app/scripts/third-party-binaries.cjs, shared by the Electron
      # afterPack sweep and the release's "Verify Windows signatures" gate.
      #
      # Windows signs every first-party executable and DLL in each native
      # payload at birth. The explicit vendor allowlist remains byte-for-byte
      # untouched; the Electron afterPack sweep later re-verifies this policy.
      #
      # For the record, since an earlier version of this comment had it
      # backwards: the cuBLAS/cudart peers are NOT NVIDIA-signed. They arrive
      # from developer.download.nvidia.com with no certificate table at all
      # (checked against NVIDIA's own sha256 manifest for 12.4.1; the copies
      # in native-v0.1.18 are byte-identical to theirs). Nothing signs them
      # now, which is the intent.
      #
      # macOS is the deliberate exception and cannot follow this policy:
      # Apple's notary service rejects any executable in the bundle that is
      # not Developer ID signed, and the vendors ship weaker signatures than
      # that (uv for macOS is `adhoc, linker-signed`, no team identifier).
      # Re-signing every Mach-O there is the price of notarization, not a
      # choice — so the macOS step below still covers third-party binaries.
      #
      # macOS signs EVERY Mach-O in the bundle — dylib peers first, main
      # binary last — with `--options runtime` (hardened runtime). All
      # peers are our own builds (ggml/llama/ssl), so hardened-runtime
      # library validation passes on same-team signatures, and the
      # notarized Electron app can enroll these binaries untouched. A
      # post-sign launch check re-runs the --help probe so a hardened-
      # runtime regression (an engine that needs JIT or dyld-env
      # entitlements) fails the job here instead of shipping.
      #
      # No signing secrets configured: PRs, forks, and dispatch test runs
      # may remain unsigned. A native-v* release tag fails closed.
      - name: Install Trusted Signing SDK (Windows)
        if: steps.preflight.outputs.pinned == 'true' && startsWith(matrix.platform, 'win32')
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: |
          if (-not $env:SIGNING_ENDPOINT) {
            if ($env:GITHUB_REF -like 'refs/tags/native-v*') {
              throw '[sign] native release tags require Azure Trusted Signing credentials'
            }
            Write-Host "[sign] no AZURE_CODE_SIGNING_ENDPOINT — binary ships unsigned"
            exit 0
          }
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 `
            -OutputDirectory "${{ runner.temp }}\TrustedSigning"
          $dlibDir = Get-ChildItem "${{ runner.temp }}\TrustedSigning\Microsoft.Trusted.Signing.Client.*\bin\x64" -Directory | Select-Object -First 1
          echo "TRUSTED_SIGNING_DLIB_PATH=$($dlibDir.FullName)\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          $metadata = @{
            Endpoint = "$env:SIGNING_ENDPOINT"
            CodeSigningAccountName = "$env:SIGNING_ACCOUNT"
            CertificateProfileName = "$env:SIGNING_PROFILE"
          } | ConvertTo-Json
          $metadataPath = "${{ runner.temp }}\metadata.json"
          Set-Content -Path $metadataPath -Value $metadata
          echo "TRUSTED_SIGNING_METADATA_PATH=$metadataPath" >> $env:GITHUB_ENV

      # `matrix.engine != 'uv'`: uv is a prebuilt binary we download from
      # Astral, not something we compile, so it ships as they published it
      # (unsigned — verified against their 0.11.32 release). Signing what we
      # build only; see packages/app/scripts/third-party-binaries.cjs.
      - name: Sign Windows native payload (Authenticode)
        if: steps.preflight.outputs.pinned == 'true' && startsWith(matrix.platform, 'win32') && matrix.engine != 'uv'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if (-not $env:TRUSTED_SIGNING_DLIB_PATH) {
            Write-Host "[sign] Trusted Signing not configured — skipping (unsigned)"
            exit 0
          }
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '10.*' } | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $signtool) { $signtool = 'signtool.exe' }
          $patterns = node packages/app/scripts/third-party-binaries.cjs --patterns | ConvertFrom-Json
          $targets = Get-ChildItem "${{ steps.outdir.outputs.dir }}" -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Where-Object {
              $name = $_.Name
              -not ($patterns | Where-Object { $name -imatch $_ })
            }
          if (-not $targets) { throw '[sign] no first-party executable/loadable files found' }
          foreach ($target in $targets) {
            Write-Host "[sign] $($target.FullName) (via $signtool)"
            & $signtool sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
              /dlib "$env:TRUSTED_SIGNING_DLIB_PATH" /dmdf "$env:TRUSTED_SIGNING_METADATA_PATH" "$($target.FullName)"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($target.FullName)" }
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Bendyline LLC') {
              throw "unexpected Authenticode identity for $($target.FullName): $($signature.Status) $($signature.SignerCertificate.Subject)"
            }
          }

      - name: Import Apple signing certificate (macOS)
        if: steps.preflight.outputs.pinned == 'true' && startsWith(matrix.platform, 'darwin')
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE_P12_BASE64:-}" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/native-v* ]]; then
              echo "::error::Native release tags require the Apple Developer ID certificate."
              exit 1
            fi
            echo "[sign] no APPLE_CERTIFICATE_P12_BASE64 — binary ships unsigned"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/native-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/native-cert.p12
          security import $RUNNER_TEMP/native-cert.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          echo "GEZEL_NATIVE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Codesign macOS binaries (Developer ID)
        if: steps.preflight.outputs.pinned == 'true' && startsWith(matrix.platform, 'darwin')
        run: |
          set -euo pipefail
          if [[ -z "${GEZEL_NATIVE_KEYCHAIN:-}" ]]; then
            echo "[sign] no Apple keychain set up — skipping (unsigned)"
            exit 0
          fi
          out="${{ steps.outdir.outputs.dir }}"
          bin="$out/${{ matrix.artifact }}"

          # Inside-out: dylib peers first, the main executable last.
          while IFS= read -r f; do
            [[ "$f" == "$bin" ]] && continue
            if file -b "$f" | grep -q 'Mach-O'; then
              echo "[sign] $f"
              codesign --force --timestamp --options runtime \
                --sign "Developer ID Application" "$f"
            fi
          done < <(find "$out" -type f)
          echo "[sign] $bin"
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" "$bin"

          while IFS= read -r f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$f"
            fi
          done < <(find "$out" -type f)

          # Hardened runtime can break an engine that needs JIT or
          # dyld-env entitlements — re-run the launch probe so that
          # class of regression fails HERE, not on a user machine.
          # Same contract as the pre-sign smoke test: non-zero exit is
          # tolerated (no GPU on the runner), silent output is not.
          if ! node scripts/smoke-native-help.mjs "$bin"; then
            echo "::error::$bin produced no --help output after hardened-runtime signing — the engine likely needs an entitlement (allow-jit / disable-library-validation). Add a per-engine entitlements plist rather than dropping --options runtime."
            exit 1
          fi
          echo "[sign] post-sign launch probe OK"

      - name: Notarize macOS native payload
        if: steps.preflight.outputs.pinned == 'true' && startsWith(matrix.platform, 'darwin') && startsWith(github.ref, 'refs/tags/native-v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Native release tags require $name for standalone payload notarization."
              exit 1
            fi
          done

          out="${{ steps.outdir.outputs.dir }}"
          submission="$RUNNER_TEMP/native-${{ matrix.engine }}-${{ matrix.platform }}.zip"
          result="$RUNNER_TEMP/native-notary-result.json"
          ditto -c -k --keepParent "$out" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$result"
          cat "$result"
          status="$(jq -r '.status // empty' "$result")"
          submission_id="$(jq -r '.id // empty' "$result")"
          if [[ "$status" != "Accepted" || -z "$submission_id" ]]; then
            echo "::error::Apple notarization returned status '$status' with submission id '$submission_id'."
            exit 1
          fi

          # Bare command-line binaries cannot carry a stapled ticket and
          # `spctl --assess` treats them as malformed app bundles ("does not
          # seem to be an app"). The Accepted notarytool result is Apple's
          # authoritative gate for this archive. Nothing mutates `out` after
          # submission; the following steps hash and pack those exact bytes.
          echo "[notary] Apple accepted standalone payload submission $submission_id"

      - name: Tear down keychain (macOS)
        if: always() && startsWith(matrix.platform, 'darwin')
        run: security delete-keychain "$RUNNER_TEMP/native-signing.keychain-db" 2>/dev/null || true

      # ── Upload ────────────────────────────────────────────────
      - name: Compute sha256
        if: steps.preflight.outputs.pinned == 'true'
        id: hash
        shell: bash
        run: |
          bin="${{ steps.outdir.outputs.dir }}/${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$bin" | awk '{print $1}')
          else
            sum=$(shasum -a 256 "$bin" | awk '{print $1}')
          fi
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "sha256 for $bin: $sum"

      - name: Resolve artifact name
        if: steps.preflight.outputs.pinned == 'true'
        id: artifactname
        shell: bash
        run: |
          if [[ -n "${{ matrix.variant }}" ]]; then
            echo "name=native-${{ matrix.engine }}-${{ matrix.platform }}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=native-${{ matrix.engine }}-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
          fi

      # Pack the tree BEFORE handing it to upload-artifact. The action has
      # no follow-symlinks knob: it stats *through* every symlink and
      # streams the target's bytes into the artifact zip, so each
      # `libX.so → libX.so.N → libX.so.N.M.P` SONAME chain comes back down
      # as three full copies. On linux-x64-cuda that inflated a 1.01 GiB
      # tree to 2.97 GiB (libcublasLt.so is 751 MB and got tripled on its
      # own), and the release tarball landed at 2.26 GB — past GitHub's
      # 2 GiB per-asset cap, which only fails at UPLOAD time, an hour into
      # the run, after the other assets are already published
      # (native-v0.1.17). tar preserves symlinks, and a single opaque file
      # gives upload-artifact nothing left to dereference.
      #
      # COPYFILE_DISABLE stops macOS bsdtar from emitting `._*` AppleDouble
      # members for xattr'd files, which would land in the shipped bundle.
      - name: Pack build output
        if: steps.preflight.outputs.pinned == 'true'
        shell: bash
        env:
          COPYFILE_DISABLE: '1'
        run: |
          set -euo pipefail
          tar -C "${{ steps.outdir.outputs.dir }}" -czf native-payload.tar.gz .
          ls -la native-payload.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.preflight.outputs.pinned == 'true'
        with:
          name: ${{ steps.artifactname.outputs.name }}
          path: native-payload.tar.gz
          # Already gzipped — a second deflate pass costs minutes on the
          # gigabyte-scale CUDA legs and buys nothing.
          compression-level: 0
          retention-days: 14

      - name: Upload manifest line
        if: steps.preflight.outputs.pinned == 'true'
        shell: bash
        run: |
          echo "${{ steps.hash.outputs.sha256 }}  ${{ matrix.artifact }}" \
            > "${{ steps.outdir.outputs.dir }}/${{ matrix.engine }}.sha256"
      # Gated on `pinned` like every other step: without it a skipped leg
      # uploads under the empty artifact name `-manifest` from an absolute
      # path outside the workspace, which is at best a confusing warning
      # and at worst a name collision between skipped legs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.preflight.outputs.pinned == 'true'
        with:
          name: ${{ steps.artifactname.outputs.name }}-manifest
          path: ${{ steps.outdir.outputs.dir }}/${{ matrix.engine }}.sha256
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Aggregate the per-platform artifacts into a draft GitHub Release.
  #
  # Only fires on tag pushes (`refs/tags/native-v*`). Manual
  # workflow_dispatch runs build + upload artifacts but skip draft
  # creation — same intent as the old release-native.yml's `if:`.
  #
  # `needs: build` waits for every matrix entry to finish (incl.
  # any preflight-skipped ones, which exit success). If a single
  # matrix job fails, we don't create a partial draft.
  # ─────────────────────────────────────────────────────────────────
  draft_release:
    name: Assemble draft native release
    needs: build
    if: startsWith(github.ref, 'refs/tags/native-v')
    runs-on: ubuntu-latest
    # Downloads every matrix artifact and assembles the draft; 6 min typical,
    # 13 on the slowest observed run.
    timeout-minutes: 45
    permissions:
      contents: write
      # actions/download-artifact@v4 lists + pulls the build jobs' artifacts
      # through the (post-2025 migration) artifact service, which requires the
      # actions:read scope. A `permissions:` block resets every unlisted scope
      # to none, so without this draft-release job 403s on ListArtifacts even
      # though the artifacts uploaded fine. (Was implicit before GitHub
      # tightened artifact-service auth + moved runners to Node 24.)
      actions: read
      # Sigstore build-provenance attestations over the release archives.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Default behaviour pulls every artifact uploaded by `build`
      # in this same workflow run — no run-id juggling, no 90-day
      # artifact-expiry concern.
      - name: Download all native build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: native-artifacts

      - name: List artifacts
        run: find native-artifacts -type f | sort

      # ── Arrange into native/build/<platform>[-<variant>]/<binary> ──
      # Artifact name pattern produced by the build job above:
      #   native-<engine>-<platform>            (single-variant engines)
      #   native-<engine>-<platform>-<variant>  (multi-variant — e.g. llama-cpp)
      # Engine names can contain hyphens (sd-cpp, llama-cpp) so we
      # match the trailing well-known platform/variant token rather
      # than splitting on `-` from the left.
      #
      # Each non-manifest artifact holds exactly one `native-payload.tar.gz`
      # (see the build job's "Pack build output"). Untar rather than copy so
      # the SONAME symlink chains stay symlinks — several engines can stage
      # into the same platform dir, and tar merges the same way `cp -R` did.
      - name: Stage into native/build/
        run: |
          set -euo pipefail
          shopt -s nullglob
          KNOWN_PLATFORMS=(darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64)
          KNOWN_VARIANTS=(metal cuda vulkan cpu)
          for dir in native-artifacts/native-* ; do
            name=$(basename "$dir")
            if [[ "$name" == *-manifest ]]; then continue; fi
            target=""
            for stem in "${KNOWN_PLATFORMS[@]}"; do
              for variant in "${KNOWN_VARIANTS[@]}" ""; do
                if [[ -n "$variant" ]]; then
                  suffix="${stem}-${variant}"
                else
                  suffix="${stem}"
                fi
                if [[ "$name" == *-"$suffix" ]]; then
                  engine="${name#native-}"
                  engine="${engine%-$suffix}"
                  target="native/build/$suffix"
                  mkdir -p "$target"
                  payload="$dir/native-payload.tar.gz"
                  if [[ ! -f "$payload" ]]; then
                    echo "::error::artifact $name has no native-payload.tar.gz — its build leg's pack step didn't run"
                    exit 1
                  fi
                  tar -C "$target" -xzf "$payload"
                  echo "staged $engine → $target"
                  break 2
                fi
              done
            done
            if [[ -z "$target" ]]; then
              echo "warning: artifact $name didn't match any known platform/variant suffix; skipping"
            fi
          done
          find native/build ! -type d | sort

      # The archive-set gate below proves every *container* exists; this
      # proves each one has contents. `needs: build` only guarantees no
      # matrix leg FAILED — a leg whose engine VERSION still holds the
      # all-zeros placeholder is preflight-skipped, exits success, and
      # uploads nothing. Without this the release would ship, say, a
      # linux-x64 archive with no gezel-ds4-server in it.
      - name: Verify staged engine binaries
        run: node scripts/check-native-payload.mjs --root native/build --all

      # ds4 and llama-server's CUDA build share the `-cuda` keys so the NVIDIA
      # redistributables ship once rather than twice (828 MB of byte-identical
      # duplication on x64 before this). llama's leg is the single writer, and
      # each engine's own smoke test can only see its own artifact — this is
      # the first point where the merged tree exists, so it is where the
      # sharing is actually verified. A skipped or failed llama CUDA leg would
      # otherwise yield a `-cuda` key whose ds4-server cannot start.
      - name: Verify CUDA payload in merged -cuda keys
        run: |
          set -euo pipefail
          bad=0
          for dir in native/build/*-cuda; do
            [[ -d "$dir" ]] || continue
            case "$dir" in
              *win32*) needed=(cudart64_ cublas64_ cublasLt64_) ;;
              *)       needed=(libcudart libcublas libcublasLt) ;;
            esac
            for lib in "${needed[@]}"; do
              if ! ls "$dir" | grep -qi "^${lib}"; then
                echo "::error::$dir is missing $lib* — the CUDA redistributables are staged by the llama-cpp CUDA leg; did it run?"
                bad=1
              fi
            done
            # ds4 resolves these through $ORIGIN once merged. Prove it here
            # rather than trusting the layout. Host-arch only: this job runs on
            # x64, so ldd cannot introspect the linux-arm64 binary and that leg
            # falls back to the filename presence check above.
            if [[ "$dir" == *linux-x64-cuda && -x "$dir/gezel-ds4-server" ]]; then
              unresolved="$(env -u LD_LIBRARY_PATH ldd "$dir/gezel-ds4-server" 2>/dev/null \
                | grep 'not found' | awk '{print $1}' | grep -v '^libcuda\.so\.1$' || true)"
              if [[ -n "$unresolved" ]]; then
                echo "::error::$dir/gezel-ds4-server has unresolved deps after merge: $unresolved"
                bad=1
              fi
            fi
          done
          if (( bad )); then exit 1; fi
          echo "CUDA redistributables present in every -cuda key; ds4 resolves against them."

      # Generate this before spending several minutes recompressing the merged
      # tree. The manifest pins concrete native bytes and exact internal
      # SONAME-link targets; unsafe, dangling, cyclic, or unpinned links fail
      # here while the per-engine run artifacts are still available.
      - name: Generate per-file native integrity manifest
        env:
          NATIVE_TAG: ${{ github.ref_name }}
        run: node scripts/generate-native-file-manifests.mjs --root native/build --version "$NATIVE_TAG" --out release/NATIVE_FILE_MANIFESTS.json

      # ── Build tarballs per platform ───────────────────────────────
      - name: Pack tarballs
        id: pack
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#native-v}"
          mkdir -p release
          cd native/build
          for platform in */ ; do
            platform="${platform%/}"
            archive_name="gezel-native-${version}-${platform}"
            if [[ "$platform" == win32-* ]]; then
              (cd "$platform" && zip -r "../../../release/${archive_name}.zip" .)
            else
              tar -C "$platform" -czf "../../release/${archive_name}.tar.gz" .
            fi
          done
          cd ../../
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la release/

      # GitHub caps a single release asset at 2 GiB. Blowing it surfaces as
      # a 422 from the upload step at the very END of a ~1h build — and
      # softprops keeps uploading the rest, so the run leaves behind a draft
      # whose SHA256SUMS lists an archive the release doesn't have. That's
      # worse than a plain failure: fetch-native-binaries.mjs refuses to
      # extract anything it can't verify, so the variant is simply dead, and
      # the ✅ lines in the log read like a success. native-v0.1.17 hit this
      # with linux-x64-cuda at 2,256,358,540 bytes. Fail here instead, where
      # the message names the archive and the overshoot.
      - name: Validate archive sizes
        run: |
          set -euo pipefail
          limit=$((2 * 1024 * 1024 * 1024))
          warn=$((limit * 3 / 4))
          over=0
          for f in release/*.tar.gz release/*.zip; do
            [[ -f "$f" ]] || continue
            size=$(stat -c %s "$f")
            human=$(numfmt --to=iec-i --suffix=B "$size")
            if (( size >= limit )); then
              echo "::error::$(basename "$f") is $human — over GitHub's 2 GiB release-asset limit by $(numfmt --to=iec-i --suffix=B $((size - limit)))"
              over=1
            elif (( size >= warn )); then
              echo "::warning::$(basename "$f") is $human — within 25% of GitHub's 2 GiB release-asset limit"
            fi
          done
          if (( over )); then exit 1; fi
          echo "All release archives are under GitHub's 2 GiB per-asset limit."

      # Keep the completeness gate in the build that creates the draft.
      # Publishing the finished draft is then a simple maintainer action
      # in the GitHub Releases UI rather than a second workflow.
      - name: Validate release archive set
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          # Archive names are derived from scripts/native-payload.mjs — the
          # same table the build matrix, the fetch script, and the Electron
          # preflight read. Add a variant there, not here.
          expected=()
          while read -r key; do
            [[ -n "$key" ]] || continue
            case "$key" in
              win32-*) expected+=("gezel-native-${VERSION}-${key}.zip") ;;
              *)       expected+=("gezel-native-${VERSION}-${key}.tar.gz") ;;
            esac
          done < <(node scripts/check-native-payload.mjs --list-keys)
          if ! diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort); then
            echo "::error::Native draft archive set is incomplete or contains unexpected files."
            exit 1
          fi
          echo "Validated ${#expected[@]} required native release archives."

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          sha256sum *.tar.gz *.zip 2>/dev/null | sort > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # ── Provenance attestations ───────────────────────────────────
      # SLSA build-provenance over the final archives + SHA256SUMS:
      # anyone can later prove an asset came from this workflow at this
      # commit via `gh attestation verify <file> --repo bendyline/gezel`.
      # Attesting at draft time is correct — publishing through GitHub's
      # Releases UI only flips the draft flag and never touches assets.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
            release/NATIVE_FILE_MANIFESTS.json

      # ── Create / update the draft GitHub Release ──────────────────
      # No signing happens in this job: the build matrix signed every
      # binary at birth (Authenticode on Windows first-party exes/DLLs; Developer
      # ID + hardened runtime on every macOS Mach-O, dylibs included),
      # so the tarballs packed above — and the SHA256SUMS over them —
      # already reflect signed bytes.
      - name: Create draft Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          token: ${{ secrets.GEZEL_RELEASE_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          name: Native binaries v${{ steps.pack.outputs.version }}
          draft: true
          generate_release_notes: true
          body: |
            Prebuilt Gezel native engine binaries, signed at birth:
            Windows first-party executables and DLLs carry Bendyline Authenticode
            signatures (Azure Trusted Signing); macOS binaries — engine
            executables and peer dylibs — are Developer ID-signed with
            hardened runtime and independently accepted by Apple's notary
            service before packaging. `SHA256SUMS` covers the signed,
            notarized code hashes, and build-provenance attestations are
            attached to every archive (verify with
            `gh attestation verify`).

            These are consumed by `.github/workflows/release-electron.yml`
            when producing installers (which verifies both hashes and
            signatures before packaging). This workflow has already
            verified the complete platform archive set and every checksum.
            After validation, publish this draft from the GitHub Releases UI.

            Each archive contains the engine binaries for one platform plus
            `THIRD_PARTY_LICENSES/` with the pin-bound native redistribution
            texts. CUDA archives also carry the CUDA Toolkit EULA supplied by
            the build image.
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
            release/NATIVE_FILE_MANIFESTS.json
