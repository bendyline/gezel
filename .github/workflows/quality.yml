name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.15.1'
  # The UI production bundle includes Monaco and Squisq's diagram/media
  # workers. Vite needs more than Node's default ~2 GiB heap to transform it.
  NODE_OPTIONS: '--max-old-space-size=4096'

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow action pin policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require immutable full-length action pins
        run: node scripts/check-workflow-action-pins.mjs

  # Conventional Commits are enforced here and nowhere else — there is no
  # local git hook, deliberately. This matters beyond tidiness:
  # multi-semantic-release derives every published npm version bump from
  # these exact messages, so a malformed subject on main silently changes
  # what the next release publishes. Checked on PRs AND on pushes to main.
  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          check-local-links: 'false'
      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `before` is all-zeros for a new branch, and can point at a commit
          # that no longer exists after a force-push. Fall back to the tip.
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi

  unit:
    name: Build, lint, typecheck, and unit tests
    needs: workflow-policy
    runs-on: ubuntu-latest
    # Runtime coverage used to tail this job; it is now the separate
    # `coverage` job below, for the reasons recorded there. What remains is
    # build/typecheck/lint plus stability pass 1 — ~25 min before coverage was
    # folded in. 60 stays as headroom for suite growth rather than because the
    # ceiling is close.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install Chromium
        # The evals suite (run by `pnpm test:ci`) launches a real headless
        # chromium for its runtime-validation scenarios (petshop, tictactoe,
        # codebase-evolution). Same playwright version as the app package, so
        # this populates the shared ~/.cache/ms-playwright the evals import uses.
        run: pnpm --filter @bendyline/gezel-evals exec playwright install --with-deps chromium
      - name: Run all unit suites (stability pass 1 of 3)
        # test:ci, not test — the CI runner has 4 vCPUs, and pnpm otherwise
        # runs several package suites at once, each with its own worker pool.
        # Serialising the packages keeps fixed test timeouts meaningful.
        run: pnpm test:ci
      - name: Enforce direct-import test-surface floors
        run: pnpm test:surface
      - name: Preserve direct-import test-surface inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-surface-inventory
          path: artifacts/test-surface-coverage.json
          # The surface command is the authoritative check. If an earlier
          # step fails, do not add a second, misleading artifact failure.
          if-no-files-found: ignore
          retention-days: 30

  coverage:
    name: Executable V8 coverage
    needs: workflow-policy
    runs-on: ubuntu-latest
    # A FOURTH execution of the UI, service and package suites, this one under
    # V8 instrumentation. It is a separate job because it reports rather than
    # gates: `unit` (stability pass 1) and `stability` (passes 2 and 3) have
    # already run these suites to completion, so a coverage timeout must never
    # be able to fail the correctness gate — and run concurrently it costs no
    # extra wall clock at all.
    #
    # Serialised into `unit` it drove that job from 25 to 58 min against a
    # 60 min ceiling between 2026-08-19 and 2026-08-22, having already forced
    # that ceiling from 45 to 60, and it blew the npm release gate outright
    # (see publish-npm.yml). Adding a suite is cheap here and expensive there;
    # keep it that way.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - name: Install Chromium
        # Required for the same reasons as in `unit` and `stability`, and this
        # job needs both: it instruments the evals suite, whose scenarios
        # launch a real headless chromium, and the service suite, whose
        # page-check tests gate on the shared ~/.cache/ms-playwright existing.
        # Without it those tests silently skip and the report under-counts.
        run: pnpm --filter @bendyline/gezel-evals exec playwright install --with-deps chromium
      - name: Measure executable V8 coverage
        run: pnpm test:coverage
      - name: Preserve executable coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-coverage
          path: artifacts/coverage/
          if-no-files-found: ignore
          retention-days: 30

  model-tool-contracts:
    name: Model-facing tool contracts
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Build the service tool-contract dependency graph
        run: pnpm --filter @bendyline/gezel-service... run build
      - name: Reject hidden or undeclared names in model-facing text
        run: pnpm lint:tool-names
      - name: Verify rendered prompts against final post-filter rosters
        run: pnpm lint:prompts

  windows-service-portability:
    name: Windows service portability contracts
    needs: workflow-policy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Build the service dependency graph
        run: pnpm --filter @bendyline/gezel-service... run build
      - name: Verify platform service-home resolution
        run: pnpm --filter @bendyline/gezel-client test src/system-service.test.ts
      - name: Exercise Windows host isolation and command shims
        run: >-
          pnpm --filter @bendyline/gezel-service test
          src/test-pool.test.ts
          src/providers/codex-cli/binary.test.ts
          src/fs/store.test.ts
          src/fs/machine-shared-store.test.ts
          src/chat/manager-machine-shared-mcp.test.ts
          src/machine-engine/bridge.integration.test.ts

  stability:
    name: Test stability (UI, service, and CLI TUI repeats)
    needs: workflow-policy
    runs-on: ubuntu-latest
    # Passes 2 and 3 run here rather than tailing the `unit` job, which
    # reached ~30 min sequentially and was cancelled at that ceiling on
    # 2026-07-27. The two repeats then ran ui+service concurrently in 19.7
    # min; serialising them (see test:stability) trades roughly 4 min of wall
    # clock for timings that do not depend on what else shares the 4 vCPUs.
    # The CLI repeat is intentionally limited to its interaction-heavy App
    # suite; repeating daemon integration here would consume the timeout
    # without adding coverage for render/input timing regressions.
    # A progressing run reached the previous 40 min ceiling on 2026-08-15;
    # leave enough headroom for ordinary hosted-runner variance. On 2026-08-31
    # the 50 min ceiling caught a healthy run mid-pass-3 with ~45s of work
    # left, and the run before it had passed with 8s to spare — the margin,
    # not the suite, was deciding the result. A job timeout surfaces as
    # "The operation was canceled", indistinguishable from a concurrency
    # cancel, so read the elapsed time before hunting for a hung test.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - name: Install Chromium
        # The service suite's page-check tests gate a real-browser block on
        # the shared ~/.cache/ms-playwright existing (see runner.test.ts).
        # Without this the repeat passes would silently skip tests that pass 1
        # runs, which is precisely the flake this job exists to catch.
        run: pnpm --filter @bendyline/gezel-app exec playwright install --with-deps chromium
      - name: Repeat UI, service, and CLI TUI suites (stability passes 2 and 3)
        run: pnpm test:stability

  packaged-bundle:
    name: Release-stamped packaged and published-artifact contracts
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # Release workflows mutate both package manifests and the exported
      # version constants before compiling. Keep one PR job on that exact
      # source shape; ordinary build/typecheck above intentionally exercises
      # the unstamped 0.0.0 development tree.
      - name: Stamp representative Electron release version
        run: node scripts/stamp-version.mjs --inc 0
      - name: Build release-stamped workspace
        run: pnpm build
      - name: Typecheck release-stamped workspace
        run: pnpm typecheck
      - name: Build and import the packaged service bundle
        run: pnpm build:bundle
      - name: Verify publishable package shapes and subpaths
        # Source-level tests resolve through workspace links and cannot catch a
        # missing export, leaked workspace range, or omitted tarball asset.
        # Keep the full clean-consumer install in the release gate, but catch
        # the hermetic packaging contract on every pull request.
        run: pnpm test:published

  supply-chain:
    name: Supply-chain audit
    needs: workflow-policy
    runs-on: ubuntu-latest
    # The font redistribution inventory is the service's built UI payload, not
    # the hand-curated source directory, so legal/SBOM checks need dist output.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Build redistributed assets
        run: pnpm build
      - name: Verify lockfile supply-chain policies
        run: pnpm audit:lockfile
      - name: Generate production SBOM
        run: pnpm audit:sbom
      - name: Production dependency vulnerability gate
        # Blocks at critical only, matching the release workflows exactly —
        # publish must never fail on something CI passed. Advisories are
        # published against our pinned versions on npm's clock, not ours, so
        # anything below critical prints as a warning without failing whatever
        # unrelated PR happens to be open.
        run: pnpm audit:vulnerabilities --audit-level=critical
      - name: Dependency license policy gate
        run: pnpm audit:licenses
      - name: Preserve supply-chain inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: artifacts/gezel.cdx.json
          if-no-files-found: ignore
          retention-days: 30

  web-smoke:
    name: Browser smoke E2E
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @bendyline/gezel-app exec playwright install --with-deps chromium
      - name: Exercise shell and write flows
        run: pnpm test:e2e:web:smoke
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-smoke-diagnostics
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  desktop-smoke:
    name: Electron and spawned-daemon smoke E2E
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - name: Exercise Electron shell and child-daemon supervision
        run: xvfb-run -a pnpm test:e2e:desktop:smoke
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-diagnostics
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
            packages/app/screenshots/
          if-no-files-found: ignore
          retention-days: 14
