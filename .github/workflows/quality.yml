name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.15.1'
  # The UI production bundle includes Monaco and Squisq's diagram/media
  # workers. Vite needs more than Node's default ~2 GiB heap to transform it.
  NODE_OPTIONS: '--max-old-space-size=4096'

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow action pin policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require immutable full-length action pins
        run: node scripts/check-workflow-action-pins.mjs

  unit:
    name: Build, lint, typecheck, and unit tests
    needs: workflow-policy
    runs-on: ubuntu-latest
    # Runtime coverage used to tail this job; it is now the separate
    # `coverage` job below, for the reasons recorded there. What remains is
    # build/typecheck/lint plus stability pass 1 — ~25 min before coverage was
    # folded in. 60 stays as headroom for suite growth rather than because the
    # ceiling is close.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - uses: ./.github/actions/setup-test-embedder
      - name: Install Chromium
        # The evals suite (run by `pnpm test:ci`) launches a real headless
        # chromium for its runtime-validation scenarios (petshop, tictactoe,
        # codebase-evolution). Same playwright version as the app package, so
        # this populates the shared ~/.cache/ms-playwright the evals import uses.
        run: pnpm --filter @bendyline/gezel-evals exec playwright install --with-deps chromium
      - name: Run all unit suites (stability pass 1 of 3)
        # test:ci, not test — the CI runner has 4 vCPUs, and pnpm otherwise
        # runs several package suites at once, each with its own worker pool.
        # Serialising the packages keeps fixed test timeouts meaningful.
        run: pnpm test:ci
      - name: Run the LibreOffice extension's Python tests
        # Stdlib-only unittest suites for the extension's pure modules
        # (discovery, HTTP/SSE, consent, relay, tool definitions). The UNO
        # layer needs LibreOffice and is covered by the manual smoke recipe
        # in packages/libreoffice-extension/README.md.
        run: pnpm --filter @bendyline/gezel-libreoffice-extension run test:py
      - name: Enforce direct-import test-surface floors
        run: pnpm test:surface
      - name: Preserve direct-import test-surface inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-surface-inventory
          path: artifacts/test-surface-coverage.json
          # The surface command is the authoritative check. If an earlier
          # step fails, do not add a second, misleading artifact failure.
          if-no-files-found: ignore
          retention-days: 30

  coverage:
    name: Executable V8 coverage (${{ matrix.shard.id }})
    needs: workflow-policy
    runs-on: ubuntu-latest
    continue-on-error: true
    # Two runners since 2026-09-30: instrumented, the service suite alone runs
    # ~32 min, and one job measuring every package had reached 51 of its 60
    # min. The other shard is chosen by exclusion, so a package added to
    # scripts/run-vitest-coverage.mjs is measured without editing this file.
    # Not fail-fast: one shard's failure says nothing about the other's report.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: service
            args: --package service
          - id: packages
            args: --exclude-package service
    # A FOURTH execution of the UI, service and package suites, this one under
    # V8 instrumentation. It is a separate job because it reports rather than
    # gates: `unit` (stability pass 1) and `stability` (passes 2 and 3) have
    # already run these suites to completion, so a coverage timeout must never
    # be able to fail the correctness gate — and run concurrently it costs no
    # extra wall clock at all.
    #
    # Serialised into `unit` it drove that job from 25 to 58 min against a
    # 60 min ceiling between 2026-08-19 and 2026-08-22, having already forced
    # that ceiling from 45 to 60, and it blew the npm release gate outright
    # (see publish-npm.yml). Adding a suite is cheap here and expensive there;
    # keep it that way.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - uses: ./.github/actions/setup-test-embedder
      - name: Install Chromium
        # Required for the same reasons as in `unit` and `stability`, and this
        # job needs both: it instruments the evals suite, whose scenarios
        # launch a real headless chromium, and the service suite, whose
        # page-check tests gate on the shared ~/.cache/ms-playwright existing.
        # Without it those tests silently skip and the report under-counts.
        run: pnpm --filter @bendyline/gezel-evals exec playwright install --with-deps chromium
      - name: Measure executable V8 coverage
        run: pnpm test:coverage -- ${{ matrix.shard.args }}
      - name: Preserve executable coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-coverage-${{ matrix.shard.id }}
          path: artifacts/coverage/
          if-no-files-found: ignore
          retention-days: 30

  model-tool-contracts:
    name: Model-facing tool contracts
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Build the service tool-contract dependency graph
        run: pnpm --filter @bendyline/gezel-service... run build
      - name: Reject hidden or undeclared names in model-facing text
        run: pnpm lint:tool-names
      - name: Verify rendered prompts against final post-filter rosters
        run: pnpm lint:prompts

  windows-service-portability:
    name: Windows service portability contracts
    needs: workflow-policy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Build the service dependency graph
        run: pnpm --filter @bendyline/gezel-service... run build
      - name: Verify platform service-home resolution
        run: pnpm --filter @bendyline/gezel-client test src/system-service.test.ts
      - name: Exercise Windows host isolation and command shims
        run: >-
          pnpm --filter @bendyline/gezel-service test
          src/test-pool.test.ts
          src/providers/codex-cli/binary.test.ts
          src/fs/store.test.ts
          src/fs/machine-shared-store.test.ts
          src/fs/atomic.test.ts
          src/fs/atomic-failures.test.ts
          src/fs/activity-tracker.test.ts
          src/fs/safe-paths.test.ts
          src/fs/mutation-containment.test.ts
          src/fs/task-files-recovery.test.ts
          src/tasks/mutation-concurrency.test.ts
          src/storage/restore.test.ts
          src/diffpack/manager.test.ts
          src/http/mutation-authority.test.ts
          src/chat/manager-machine-shared-mcp.test.ts
          src/machine-engine/bridge.integration.test.ts

  stability:
    name: Test stability pass ${{ matrix.pass }} of 3 (UI, service, and CLI TUI)
    needs: workflow-policy
    runs-on: ubuntu-latest
    # Passes 2 and 3 run here rather than tailing the `unit` job, which
    # reached ~30 min sequentially and was cancelled at that ceiling on
    # 2026-07-27. Each pass runs its suites one after another (see
    # test:stability:pass) so its timings do not depend on what else shares
    # the 4 vCPUs. The CLI repeat is intentionally limited to its
    # interaction-heavy App suite; repeating daemon integration here would
    # consume the timeout without adding coverage for render/input timing
    # regressions.
    # Both passes shared one job until 2026-09-30, and its ceiling went 40 ->
    # 50 -> 70 min as the service suite grew; with a pass at ~34 min (service
    # alone ~29) two back to back overran 70 on every push to main, and the
    # green PR runs cleared it by two minutes. A runner per pass keeps each
    # pass's timings independent and puts each job near half its ceiling. Not
    # fail-fast: whether a flake reproduces in the other pass is the point.
    # A job timeout surfaces as "The operation was canceled", indistinguishable
    # from a concurrency cancel, so read the elapsed time before hunting for a
    # hung test.
    strategy:
      fail-fast: false
      matrix:
        pass: [2, 3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - uses: ./.github/actions/setup-test-embedder
      - name: Install Chromium
        # The service suite's page-check tests gate a real-browser block on
        # the shared ~/.cache/ms-playwright existing (see runner.test.ts).
        # Without this the repeat passes would silently skip tests that pass 1
        # runs, which is precisely the flake this job exists to catch.
        run: pnpm --filter @bendyline/gezel-app exec playwright install --with-deps chromium
      - name: Repeat UI, service, and CLI TUI suites (stability pass ${{ matrix.pass }} of 3)
        run: pnpm test:stability:pass

  packaged-bundle:
    name: Release-stamped packaged and published-artifact contracts
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Install Linux metadata validator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream
      - name: Validate Linux AppStream metadata
        run: appstreamcli validate packages/app/assets/com.bendyline.gezel.metainfo.xml
      # Release workflows mutate both package manifests and the exported
      # version constants before compiling. Keep one PR job on that exact
      # source shape; ordinary build/typecheck above intentionally exercises
      # the unstamped 0.0.0 development tree.
      - name: Stamp representative Electron release version
        id: release-version
        run: |
          version="$(node scripts/stamp-version.mjs --inc 0 --print)"
          node scripts/stamp-version.mjs --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release-stamped workspace
        run: pnpm build
      - name: Typecheck release-stamped workspace
        run: pnpm typecheck
      - name: Release-contract tests on the stamped workspace
        # The Electron release runs the whole suite after stamping. These are
        # the tests that read repository source and workflows, so they are the
        # ones a stamp can break: prepare-package.test.mjs asserted the 0.0.0
        # baseline and failed only at release time (run 37451680238).
        run: pnpm --filter @bendyline/gezel-app run test
      - name: Build and import the packaged service bundle
        run: pnpm build:bundle
      - name: Generate release-stamped SBOM
        run: pnpm audit:sbom
      - name: Verify release version propagation
        run: |
          node scripts/verify-release-version.mjs \
            --version "${{ steps.release-version.outputs.version }}" \
            --service-meta packages/app/dist/service-bundle.meta.json \
            --sbom artifacts/gezel.cdx.json
      - name: Verify publishable package shapes and subpaths
        # Source-level tests resolve through workspace links and cannot catch a
        # missing export, leaked workspace range, or omitted tarball asset.
        # Keep the full clean-consumer install in the release gate, but catch
        # the hermetic packaging contract on every pull request.
        run: pnpm test:published

  npm-release-candidate:
    name: npm release toolchain and candidate
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Check release toolchain
        run: pnpm check:release-toolchain
      - name: Rehearse release-stamped npm artifacts
        # This is the same strict tarball install the publish gate runs through
        # `pnpm validate`, including the CLI/daemon version assertions.
        run: pnpm check:npm-release-candidate

  supply-chain:
    name: Supply-chain audit
    needs: workflow-policy
    runs-on: ubuntu-latest
    # The font redistribution inventory is the service's built UI payload, not
    # the hand-curated source directory, so legal/SBOM checks need dist output.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Build redistributed assets
        run: pnpm build
      - name: Verify lockfile supply-chain policies
        run: pnpm audit:lockfile
      - name: Generate production SBOM
        run: pnpm audit:sbom
      - name: Production dependency vulnerability gate
        # Match release/publish: high and critical block unless an exact,
        # unexpired exception verifies the reviewed installed code bytes.
        run: pnpm audit:vulnerabilities --audit-level=high
      - name: Dependency license policy gate
        run: pnpm audit:licenses
      - name: Preserve supply-chain inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: artifacts/gezel.cdx.json
          if-no-files-found: ignore
          retention-days: 30

  web-e2e:
    name: Browser E2E
    needs: workflow-policy
    runs-on: ubuntu-latest
    # ~9 min green: build 2.5, full suite 3, smoke repeats 1.3.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @bendyline/gezel-app exec playwright install --with-deps chromium
      - name: Run the full browser suite
        # Every spec, not a subset. The Electron release gates on this same
        # suite, and a spec left out here first fails on a release candidate:
        # PR #71 changed three behaviors the unrun specs still asserted, and
        # the first run to notice was the release, 30 s after the merge.
        run: pnpm test:e2e:web:run
      - name: Repeat shell and write flows without retries
        run: pnpm test:e2e:web:smoke
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-diagnostics
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  desktop-smoke:
    # Keep the existing check name for branch-protection rules.
    name: Electron and spawned-daemon smoke E2E
    needs: workflow-policy
    runs-on: ubuntu-latest
    # The full suite takes ~13 min, plus build and the smoke repeat.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build
      - name: Run the full Electron suite
        # Release run 38003585468 caught a knowledge-catalog regression that
        # the two-spec smoke subset never exercised. Match the release gate.
        run: xvfb-run -a pnpm test:e2e:run
      - name: Repeat Electron shell and child-daemon supervision without retries
        run: xvfb-run -a pnpm test:e2e:desktop:smoke
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-diagnostics
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
            packages/app/screenshots/
          if-no-files-found: ignore
          retention-days: 14
