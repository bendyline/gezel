# npm release workflow — versions, changelogs, tags and publishes the gezel
# packages to npm via multi-semantic-release. Package tags remain in Git for
# version calculation; npm publishes do not create GitHub Release entries.
#
# Trigger: manual dispatch only. Same house rule as release-electron.yml —
# a CI run must never be able to ship by accident. Merging to main changes
# nothing until a maintainer dispatches this.
#
# ── npm AUTHENTICATION IS NOT IN THIS REPO ───────────────────────────────
# There is deliberately no NPM_TOKEN / NODE_AUTH_TOKEN here. Publishing uses
# npm Trusted Publishing (OIDC), configured OUTSIDE this repo on npmjs.com.
# Each published package must have a trusted publisher registered pointing at:
#
#     repository: bendyline/gezel
#     workflow:   .github/workflows/publish-npm.yml
#
# with NO GitHub Environment (this job configures none, so the trusted
# publisher must not require one either).
#
# How it works: scripts/publish-package.mjs shells out to `pnpm publish`,
# which exchanges this job's GitHub OIDC token for a short-lived npm token.
# That is why `id-token: write` below and setup-node's `registry-url` are
# BOTH required — the exchange only runs when the resolved registry is
# exactly registry.npmjs.org. `--provenance` rides on the same OIDC token.
#
# IF A RELEASE EVER FAILS WITH "No npm token specified." (ENONPMTOKEN), the
# trusted-publisher config on npmjs.com has been dropped or no longer matches
# this workflow's path/repo. It is NOT a missing secret. Note in particular
# that the config is keyed on the workflow FILE PATH — renaming this file
# breaks publishing until the trusted publishers are re-pointed.
#
# First publish: trusted publishing can only be configured on a package that
# already exists, so the initial version of each package is published once by
# hand with a granular token. See docs/npm-release.md.

name: Publish npm packages
run-name: Publish npm packages from ${{ github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and compute versions, but publish nothing.'
        type: boolean
        default: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.15.1'
  # The UI production bundle includes Monaco and Squisq's diagram/media
  # workers. Vite needs more than Node's default ~2 GiB heap to transform it.
  NODE_OPTIONS: '--max-old-space-size=4096'

permissions:
  contents: read

# Never let two releases interleave — multi-semantic-release reads and writes
# git tags, and a concurrent run would compute versions against a moving base.
concurrency:
  group: release-npm
  cancel-in-progress: false

# The canonical gate, `pnpm validate`, runs here on four runners at once,
# because one runner no longer holds it. It blew a 90 min cap on 2026-08-22
# (`test:coverage` went in unnoticed and has since moved out, to PR CI and
# `pnpm all`). Then it crept to 142-148 min under a 150 min cap as the service
# suite grew: that suite runs three times in the gate, about 30 min each, and
# hosted-runner speed alone moved the whole gate between 84 min (2026-10-06)
# and 145 (2026-10-14). On 2026-10-15 the cap cancelled it six minutes short.
#
# scripts/validate-workspace.mjs owns the split, not this file: `--phase=e2e`
# and `--phase=stability` each build and then run the steps of
# `validate:unlocked` they take, and `--phase=main` runs every step neither
# takes. A check added to `validate` therefore lands in `main` without an edit
# here. From the 2026-10-15 stage timings, on a slow runner: main ~75 min, a
# stability pass ~50, e2e ~25.
#
# The caps are headroom over those numbers, not targets. PR CI hides how close
# they are, because quality.yml fans the same work across more, smaller jobs.
# When one is approached, move more of the chain into a phase rather than
# raise it.
jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release derives every version bump from commit history.
          fetch-depth: 0

      - name: Require immutable full-length action pins
        run: node scripts/check-workflow-action-pins.mjs

      # Trusted publishing cannot create a package, so an unbootstrapped one
      # fails mid-release after its dependents have shipped. Fail here, in
      # seconds, instead (gezel-knowledge 2026-08, gezel-script-runtime 2026-09).
      - name: Require every release package to exist on npm
        run: node scripts/check-npm-bootstrap.mjs

      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # The prewarm runs service source under tsx, which loads the embedder
      # from inference's built `dist/` through its `./internal/*` export; that
      # dist in turn imports core, catalog, client and knowledge, and
      # `inference...` builds them too. Quality's jobs have already run
      # `pnpm build` by this point; this job leaves that to `validate`, so
      # build just the prewarm's closure rather than the whole workspace twice.
      - name: Build the test embedder's dependencies
        run: pnpm --filter "@bendyline/gezel-inference..." run build

      # `pnpm validate` runs the embedding-backed service suites. Prewarm the
      # shared test model before Vitest workers can race a cold or partial
      # download, matching the unit, coverage, and stability jobs in Quality.
      - uses: ./.github/actions/setup-test-embedder

      - name: Install Chromium
        uses: ./.github/actions/install-chromium
        with:
          filter: '@bendyline/gezel-evals'

      # The canonical gate, less the steps the other verify jobs take. Keep
      # local, CI and release assurance identical: add mandatory checks to the
      # root `validate` script rather than duplicating a step list here.
      # `validate` includes the release-toolchain preflight, a release-stamped
      # package rehearsal, `test:published`, and `check:packages`, covering
      # tarball shape, size budgets, versioning, workspace-protocol
      # resolution, and a real `npm install` of the tarballs into a
      # non-workspace project followed by a daemon boot.
      - name: Canonical gate
        run: xvfb-run -a pnpm validate --phase=main

      - name: Audit licenses
        run: pnpm audit:licenses
      - name: Generate SBOM
        run: pnpm audit:sbom
      - name: Audit vulnerabilities
        # critical matches the PR-time gate in quality.yml — the two must
        # stay in lockstep so a publish never fails on something CI passed.
        run: pnpm audit:vulnerabilities --audit-level=critical

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-sbom
          path: artifacts/gezel.cdx.json
          retention-days: 14

  verify-stability:
    name: Verify release (stability pass ${{ matrix.pass }} of 3)
    runs-on: ubuntu-latest
    # `validate`'s `test:stability` repeats the UI, service and CLI TUI suites
    # twice after `test:ci` ran them once; here each repeat gets a runner. Not
    # fail-fast: whether a flake reproduces in the other pass is the point.
    strategy:
      fail-fast: false
      matrix:
        pass: [2, 3]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Same reason as in `verify`: the prewarm loads the embedder from
      # inference's built `dist/` before the phase's own `pnpm build` runs.
      - name: Build the test embedder's dependencies
        run: pnpm --filter "@bendyline/gezel-inference..." run build

      - uses: ./.github/actions/setup-test-embedder

      # The service suite's page-check tests skip their real-browser block
      # when the shared ~/.cache/ms-playwright is empty, which would let a
      # repeat pass skip tests the first pass ran.
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
        with:
          filter: '@bendyline/gezel-evals'

      - name: Canonical gate (stability)
        run: xvfb-run -a pnpm validate --phase=stability

  verify-e2e:
    name: Verify release (Electron and browser E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # The phase's `pnpm pw:install` fetches the browser; this adds the
      # system libraries it needs on a fresh runner.
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
        with:
          filter: '@bendyline/gezel-evals'

      - name: Canonical gate (E2E)
        run: xvfb-run -a pnpm validate --phase=e2e

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-e2e-diagnostics
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish packages
    needs: [verify, verify-stability, verify-e2e]
    runs-on: ubuntu-latest
    # npm publish-time scanning can now delay artifact availability for tens of
    # minutes. Leave room for the 40-minute registry verifier plus build,
    # publishing, and the clean-consumer checks that follow availability.
    timeout-minutes: 75
    permissions:
      # semantic-release pushes release commits and per-package git tags.
      contents: write
      # Load-bearing for npm publishing, not just provenance: this repo has no
      # NPM_TOKEN. See the header.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          check-local-links: 'false'
          # Required for the OIDC token exchange — it only fires when the
          # resolved registry is exactly registry.npmjs.org.
          registry-url: 'https://registry.npmjs.org'

      # The tarballs must contain built output. `verify` ran in a different
      # job on a clean runner, so build again here rather than shipping
      # whatever a partial cache left behind.
      - name: Build
        run: pnpm build

      # multi-semantic-release serializes each package's prepare+publish pair.
      # prepare-package.mjs therefore preserves its computed dependency
      # upgrades outside the checkout before restoring workspace:* for the
      # release commit. format-release-manifest.mjs then restores Biome's
      # package.json layout before git snapshots it. publish-package.mjs
      # materializes computed versions only while pnpm packs that package. Do
      # not add `--sequential-prepare`: the
      # installed multi-semantic-release has no such option and silently
      # forwards unknown flags to semantic-release.
      #
      # packages/sharp-compat and packages/phonemizer-compat are ignored rather
      # than left to their `private: true` flag. That flag stops the publish,
      # but multi-semantic-release would still version them, write CHANGELOGs,
      # and cut git tags named literally `sharp@x.y.z` / `phonemizer@x.y.z` —
      # they occupy those dependency slots for Transformers.js and kokoro-js
      # and are not gezel release lines.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEZEL_RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          args=(--ignore-packages=packages/ui,packages/mobile,packages/capacitor,packages/eval-viewer,packages/sharp-compat,packages/phonemizer-compat,packages/ml-runtime,packages/libreoffice-extension,evals)
          if [[ "$GEZEL_RELEASE_DRY_RUN" == "1" ]]; then
            args+=(--dry-run)
          fi
          pnpm exec multi-semantic-release "${args[@]}"

      # multi-semantic-release rewrites local dependency ranges during its
      # prepare phase. prepare-package.mjs restores workspace:* before each
      # package's release commit; this final gate proves both that invariant
      # and the committed lockfile still agree after the complete release.
      - name: Verify post-release workspace state
        if: ${{ always() && steps.release.outcome != 'skipped' }}
        run: |
          pnpm check:workspace-deps
          pnpm install --lockfile-only --frozen-lockfile

      # Re-download exact versions after publish and test registry bytes. This
      # catches registry-side packing/provenance drift independently of the
      # pre-publish rehearsal. A dry run has nothing new to download.
      - name: Verify published npm artifacts
        if: ${{ steps.release.outcome == 'success' && !inputs.dry_run }}
        run: node scripts/verify-published-npm-release.mjs
