# Daily advisory report. Every CI and release workflow blocks at critical only
# and reports lower-severity findings without failing. Advisories are published
# against our pinned versions on npm's clock, not ours, so this schedule keeps
# new high/moderate/low findings visible without turning them into release gates.
name: Supply-chain audit

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.15.1'

jobs:
  vulnerabilities:
    name: Production dependency vulnerability alarm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Verify lockfile supply-chain policies
        run: pnpm audit:lockfile
      - name: Production dependency vulnerability audit
        run: pnpm audit:vulnerabilities --audit-level=critical
